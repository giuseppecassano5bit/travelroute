<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Da Gravina a Karlovo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Stessa identità del sito: carta chiara, inchiostro, verde per i treni, magenta per il volo. */
:root {
  --ink: #172a3a;
  --ink-2: #4e5f6d;
  --paper: #f1f4ef;
  --surface: #ffffff;
  --rule: #cfd7d0;
  --rail: #1e7a52;
  --air: #b3246f;
  --glow: #f2a93b;
  --focus: #1d5fa8;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink); color: var(--ink); overflow: hidden; touch-action: none;
  font-family: 'Overpass', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
#scene:active { cursor: grabbing; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[hidden] { display: none !important; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
}
.hud > * { pointer-events: auto; }
.panel { background: rgb(241 244 239 / 90%); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 8px; }
.legbox { padding: 10px 14px 12px; min-width: 0; max-width: 60vw; }
.legname { font-weight: 800; font-size: 15px; line-height: 1.2; }
.legcount { font-size: 13px; color: var(--ink-2); }
.legline { display: flex; align-items: center; margin-top: 8px; }
.legline .dot { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--surface); box-sizing: border-box; }
.legline .dot.passed { background: var(--ink); }
.legline .dot.now { box-shadow: 0 0 0 3px rgb(23 42 58 / 18%); }
.legline .seg { width: 20px; height: 4px; background: var(--rail); }
.legline .seg.air { background: var(--air); }
.legline .seg.todo { opacity: 0.3; }
.legprogress { height: 3px; margin-top: 8px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.legprogress span { display: block; height: 100%; width: 0; background: var(--ink); }
.lights { font-size: 13px; color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }

.tools { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.sound { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; }
.icon-button {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 6px;
  border: 0; background: transparent; color: var(--ink); cursor: pointer;
}
.icon-button:hover { background: rgb(23 42 58 / 8%); }
.icon-button svg { width: 22px; height: 22px; }
#volume { width: 110px; accent-color: var(--ink); }
.close { font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; padding: 8px 12px; }
.close:hover { text-decoration: underline; }

.hint {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 2;
  transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center;
  padding: 8px 14px; font-size: 14px; transition: opacity 0.8s;
}
.hint.gone { opacity: 0; pointer-events: none; }

/* Cartoline: stesso trattamento della scheda d'esempio del sito */
.card {
  position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(460px, calc(100% - 32px)); box-sizing: border-box;
  background: var(--surface); border-top: 6px solid var(--ink); border-radius: 4px 4px 10px 10px;
  padding: 24px 26px 26px; box-shadow: 0 18px 50px rgb(10 20 30 / 35%);
}
.card h1, .card h2 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
.card h1 { font-size: clamp(28px, 7vw, 38px); }
.card h2 { font-size: clamp(26px, 6vw, 34px); }
.card p { margin: 10px 0 0; color: var(--ink-2); }
.card .kicker { margin: 0 0 6px; color: var(--ink-2); font-size: 15px; }
.card .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn {
  font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none;
  padding: 12px 20px; border-radius: 6px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
}
.btn:hover { background: var(--rail); border-color: var(--rail); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stops { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 2px; font-size: 15px; }
.stops li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: center; }
.stops li::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid var(--ink); box-sizing: border-box; justify-self: center; }
.stops .air::before { border-color: var(--air); }

/* Titolo della tappa: compare in basso a sinistra e poi se ne va */
.title-card {
  position: fixed; z-index: 2; left: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  max-width: min(440px, calc(100% - 32px));
  background: var(--surface); border-top: 6px solid var(--ink); border-radius: 4px 4px 10px 10px;
  padding: 16px 20px 18px; box-shadow: 0 12px 36px rgb(10 20 30 / 30%);
  transition: opacity 0.9s, transform 0.9s;
}
.title-card.gone { opacity: 0; transform: translateY(12px); pointer-events: none; }

/* Dissolvenza sulla carta tra una tappa e l'altra */
#fade { position: fixed; inset: 0; z-index: 4; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity 0.7s; }
#fade.on { opacity: 1; pointer-events: auto; }
.title-card .kicker { margin: 0; color: var(--ink-2); font-size: 14px; }
.title-card h2 { margin: 2px 0 0; font-size: clamp(26px, 5.5vw, 36px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.title-card p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
@media (prefers-reduced-motion: reduce) {
  .title-card, .hint { transition: opacity 0.3s; }
  .title-card.gone { transform: none; }
}
@media (max-width: 520px) {
  #volume { width: 80px; }
  .legbox { max-width: 58vw; }
  .card { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-height: calc(100% - 190px); overflow-y: auto; }
}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Scena 3D del viaggio: trascina per guardarti intorno, oppure usa le frecce"></canvas>

<div class="hud">
  <div class="legbox panel" aria-live="polite">
    <div class="legname" id="legname">Gravina in Puglia</div>
    <div class="legcount" id="legcount">Tappa 1 di 6</div>
    <div class="legline" id="legline" aria-hidden="true"></div>
    <div class="legprogress" aria-hidden="true"><span id="legprogress"></span></div>
    <div class="lights" id="lights" hidden></div>
  </div>
  <div class="tools">
    <div class="sound panel">
      <button type="button" class="icon-button" id="mute" aria-pressed="false" aria-label="Disattiva l'audio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>
          <path id="wave1" d="M16 9.5a3.5 3.5 0 0 1 0 5"/>
          <path id="wave2" d="M18.5 7a7 7 0 0 1 0 10"/>
          <path id="cross" d="M16 9l5 6m0-6l-5 6" hidden/>
        </svg>
      </button>
      <label for="volume" class="legcount">Volume</label>
      <input id="volume" type="range" min="0" max="100" value="40">
    </div>
    <a class="close panel" id="close" href="/" hidden>Torna alla ricerca</a>
  </div>
</div>

<p class="hint panel gone" id="hint"></p>
<div id="fade" aria-hidden="true"></div>

<section class="title-card gone" id="titlecard" aria-live="polite">
  <p class="kicker" id="tc-kicker"></p>
  <h2 id="tc-name"></h2>
  <p id="tc-sub"></p>
</section>

<section class="card" id="startcard">
  <p class="kicker">Il viaggio d'esempio del sito, da vivere</p>
  <h1>Da Gravina a Karlovo</h1>
  <p>Sei tappe in treno e in aereo, da un paese della Murgia alla Valle delle Rose in Bulgaria. Non si può sbagliare: guardati intorno e goditi il viaggio.</p>
  <ol class="stops" id="startstops"></ol>
  <p id="controls-hint"></p>
  <div class="actions">
    <button type="button" class="btn" id="start">Parti</button>
  </div>
</section>

<section class="card" id="endcard" hidden>
  <p class="kicker" id="end-kicker"></p>
  <h2 id="end-title"></h2>
  <p id="end-text"></p>
  <div class="actions" id="end-actions"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
'use strict';
/* =====================================================================================================
   Da Gravina a Karlovo: il viaggio d'esempio del sito in sei tappe, tutto procedurale (niente modelli,
   texture o suoni scaricati). Sistemi condivisi: renderer, cielo e luce per tappa, terreno, binari e treni,
   camera che orbita attorno al mezzo, "sguardo che risveglia" le cose, musica Web Audio con dissolvenze.
   Ogni tappa è una funzione che costruisce la sua scena con questi pezzi.
   ===================================================================================================== */

const LEGS = [
  { name: 'Gravina in Puglia', mode: 'rail', kicker: 'Tappa 1 di 6, treno FAL all\'alba', counter: 'Case illuminate',
    sub: 'Il treno lascia la città sulla gravina. Guarda le case sul burrone: al tuo sguardo si accendono.', build: () => buildGravina() },
  { name: 'La Murgia', mode: 'rail', kicker: 'Tappa 2 di 6, treno FAL verso Bari', counter: 'Papaveri fioriti',
    sub: 'Grano, muretti a secco e la cattedrale di Altamura. Guarda i campi: dove poggi lo sguardo fioriscono i papaveri.', build: () => buildMurgia() },
  { name: 'Bari', mode: 'rail', kicker: 'Tappa 3 di 6, treno per l\'aeroporto', counter: 'Barche imbandierate',
    sub: 'Il lungomare, San Nicola e le barche dei pescatori: guardale e alzeranno le bandiere.', build: () => buildBari() },
  { name: 'In volo sui Balcani', mode: 'air', kicker: 'Tappa 4 di 6, volo per Sofia', counter: 'Anelli di nuvole',
    sub: 'Sopra le nuvole dell\'Adriatico e dei Balcani. Trascina per guidare l\'aereo dentro gli anelli di nuvole.', build: () => buildFlight() },
  { name: 'Sofia', mode: 'rail', kicker: 'Tappa 5 di 6, metro M4 all\'ora dorata', counter: 'Cupole scintillanti',
    sub: 'I grandi condomini, il monte Vitosha e le cupole d\'oro delle chiese: guardale e brilleranno.', build: () => buildSofia() },
  { name: 'Karlovo, Valle delle Rose', mode: 'rail', kicker: 'Tappa 6 di 6, treno BDŽ al tramonto', counter: 'Campi di rose',
    sub: 'La valle delle rose sotto i monti Balcani. Guarda i campi: il vento solleva i petali.', build: () => buildKarlovo() },
];

const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const inSite = window.self === window.top && location.pathname.endsWith('viaggio.html');
const C = (h) => new THREE.Color(h);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);
const tmpC = new THREE.Color();
const tmpV3 = new THREE.Vector3();

// Numeri casuali ripetibili: ogni scena è uguale a ogni visita.
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }

/* ----------------------------------------------- Audio ----------------------------------------------- */
const Sound = (() => {
  let ctx, master, sfxBus, ambBus, reverbIn, noiseBuf, musicBus = null;
  let volume = 0.4, muted = false;
  let score = null, step = 0, nextTime = 0, timer = null, chimeQueue = 0;
  let amb = [], ambCfg = {}, birdTimer = 2, cricketTimer = 0, cricketLevel = 0, rumble = null, drone = null;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 3;
    master = ctx.createGain(); master.gain.value = muted ? 0 : volume;
    master.connect(comp).connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0.8; ambBus.connect(master);
    // Rumore bianco: vento, mare, rotaie, respiro del flauto.
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // Riverbero da una risposta all'impulso generata (rumore che si spegne), niente file.
    const conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.8);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    conv.buffer = ir;
    reverbIn = ctx.createGain(); reverbIn.gain.value = 0.5;
    const revOut = ctx.createGain(); revOut.gain.value = 0.55;
    reverbIn.connect(conv).connect(revOut).connect(master);
    document.addEventListener('visibilitychange', () => { if (document.hidden) ctx.suspend(); else ctx.resume(); });
  }

  const node = {
    osc(type, f) { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return o; },
    gain(v) { const g = ctx.createGain(); g.gain.value = v; return g; },
    filter(type, f, q = 0.7) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; },
    noise() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s; },
  };

  function newMusicBus() {
    const bus = ctx.createGain(); bus.gain.value = 0.0001; bus.connect(master);
    // Eco a tempo, con un filtro nel giro di ritorno: le note si allargano senza impastarsi.
    const d = ctx.createDelay(2), fb = node.gain(0.32), lp = node.filter('lowpass', 2200), wet = node.gain(0.32);
    d.connect(lp).connect(fb).connect(d); d.connect(wet).connect(bus);
    bus._delay = d;
    return bus;
  }

  // Manda un suono al bus giusto (musica o effetti), con panorama, eco e riverbero facoltativi.
  function out(g, o = {}) {
    const bus = o.bus === 'sfx' ? sfxBus : musicBus;
    let last = g;
    if (o.pan) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; g.connect(p); last = p; }
    last.connect(bus);
    if (o.echo && bus._delay) last.connect(node.gain(o.echo)).connect(bus._delay);
    if (o.reverb) last.connect(node.gain(o.reverb)).connect(reverbIn);
  }

  // Corda pizzicata: attacco secco, filtro che si chiude, un'ottava sopra per il luccichio.
  function pluck(midi, t, o = {}) {
    const f = mtof(midi), dur = o.dur ?? 1.6, bright = o.bright ?? 2600;
    const o1 = node.osc(o.type ?? 'triangle', f), o2 = node.osc('sine', f * 2), g2 = node.gain(o.shimmer ?? 0.22);
    const lp = node.filter('lowpass', bright);
    lp.frequency.setValueAtTime(bright, t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(250, f * 1.4), t + dur * 0.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain ?? 0.16, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g);
    out(g, { echo: 0.35, reverb: 0.3, ...o });
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  const strum = (notes, t, o = {}) => notes.forEach((n, k) => pluck(n, t + k * (o.spread ?? 0.018), o));

  // Accordo tenuto: archi morbidi (due denti di sega poco stonati per nota, filtrati) e basso.
  function pad(notes, t, len, o = {}) {
    const peak = o.gain ?? 0.016, att = o.attack ?? 2.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att);
    g.gain.setValueAtTime(peak, t + len); g.gain.exponentialRampToValueAtTime(0.0001, t + len + 2.6);
    const lp = node.filter('lowpass', o.cutoff ?? 800, 0.4);
    lp.connect(g); out(g, { reverb: 0.4 });
    for (const n of notes) {
      for (const det of [-7, 6]) {
        const s = node.osc('sawtooth', mtof(n)); s.detune.value = det; s.connect(lp); s.start(t); s.stop(t + len + 2.8);
      }
    }
    if (o.bass === false) return;
    const b = node.osc('sine', mtof(notes[0] - 12)), bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t); bg.gain.exponentialRampToValueAtTime(o.bassGain ?? 0.08, t + 1.2);
    bg.gain.setValueAtTime(o.bassGain ?? 0.08, t + len); bg.gain.exponentialRampToValueAtTime(0.0001, t + len + 2.2);
    b.connect(bg); out(bg, {}); b.start(t); b.stop(t + len + 2.4);
  }

  // Kaval: flauto di legno dei Balcani, con fiato, vibrato che arriva piano, attacco morbido.
  function flute(midi, t, dur, o = {}) {
    const f = mtof(midi), peak = o.gain ?? 0.06;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.08);
    g.gain.setValueAtTime(peak, t + Math.max(0.1, dur - 0.15)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
    const o1 = node.osc('sine', f), o2 = node.osc('triangle', f), g2 = node.gain(0.18);
    const lfo = node.osc('sine', 5.2), lg = ctx.createGain();
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.007, t + 0.35);
    lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    const lp = node.filter('lowpass', f * 4);
    o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g);
    const br = node.noise(), bp = node.filter('bandpass', f * 1.5, 1.5), bg = node.gain(0.28);
    br.connect(bp).connect(bg).connect(g);
    out(g, { echo: 0.2, reverb: 0.5, ...o });
    [o1, o2, lfo].forEach((x) => { x.start(t); x.stop(t + dur + 0.3); });
    br.start(t, Math.random()); br.stop(t + dur + 0.3);
  }

  // Campana (chiese ortodosse, anelli di nuvole): parziali non armoniche che si spengono a tempi diversi.
  function bell(midi, t, o = {}) {
    const f = mtof(midi), g = node.gain(1), peak = o.gain ?? 0.05;
    [[0.5, 0.5, 4], [1, 1, 3.5], [1.19, 0.45, 2.4], [1.56, 0.35, 2], [2, 0.3, 1.8], [2.51, 0.2, 1.4], [3, 0.15, 1.2]].forEach(([r, a, d]) => {
      const s = node.osc('sine', f * r), pg = ctx.createGain();
      pg.gain.setValueAtTime(0.0001, t); pg.gain.exponentialRampToValueAtTime(peak * a, t + 0.004);
      pg.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(pg).connect(g); s.start(t); s.stop(t + d + 0.05);
    });
    out(g, { reverb: 0.7, echo: 0.1, ...o });
  }

  // Tamburello della pizzica: sonagli (rumore acuto) e, sugli accenti, la pelle.
  function tambo(t, accent, amount = 1, bus) {
    const src = node.noise(), hp = node.filter('highpass', 5500), bp = node.filter('bandpass', 9000, 0.9), g = ctx.createGain();
    const peak = (accent ? 0.045 : 0.022) * amount;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    src.connect(hp).connect(bp).connect(g); out(g, { bus, reverb: 0.15 });
    src.start(t, Math.random()); src.stop(t + 0.13);
    if (!accent) return;
    const s = node.osc('sine', 190), sg = ctx.createGain();
    s.frequency.exponentialRampToValueAtTime(95, t + 0.12);
    sg.gain.setValueAtTime(0.0001, t); sg.gain.exponentialRampToValueAtTime(0.07, t + 0.004);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    s.connect(sg); out(sg, { bus }); s.start(t); s.stop(t + 0.18);
  }

  // Tapan (tamburo bulgaro): colpo grave con un clic.
  function drum(t, o = {}) {
    const f = o.f ?? 105, s = node.osc('sine', f), g = ctx.createGain();
    s.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.2);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain ?? 0.12, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.short ? 0.12 : 0.45));

    const flt = node.filter(type, f, q), g = node.gain(0.0001);
    const lfo = node.osc('sine', rate), lg = node.gain(level * depth);
    lfo.connect(lg).connect(g.gain);

    src.connect(flt).connect(g).connect(ambBus); src.start(0, Math.random() * 1.5); lfo.start();
    return () => { g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.8); setTimeout(() => { src.stop(); lfo.stop(); }, 3500); };
  }
  function toneLoop(f, level) {
    const s = node.osc('sine', f), g = node.gain(0.0001);
    g.gain.setTargetAtTime(level, ctx.currentTime, 2); s.connect(g).connect(ambBus); s.start();
    return () => { g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.8); setTimeout(() => s.stop(), 3500); };
  }
  function setAmbience(cfg = {}) {
    amb.forEach((stop) => stop()); amb = []; ambCfg = cfg; cricketLevel = 0;
    if (cfg.wind) amb.push(noiseLoop('bandpass', 480, 0.6, cfg.wind, 0.09, 0.45));
    if (cfg.sea) { amb.push(noiseLoop('lowpass', 600, 0.3, cfg.sea, 0.11, 0.7)); amb.push(noiseLoop('bandpass', 1900, 0.5, cfg.sea * 0.22, 0.11, 0.7)); }

  }

  // Rondini e grillai, gabbiani, grilli: brevi versi sintetici, qua e là nello spazio stereo.
  function swallows() {
    const t0 = ctx.currentTime + 0.05, kestrel = Math.random() < 0.35;
    const n = kestrel ? 4 + Math.floor(Math.random() * 3) : 2 + Math.floor(Math.random() * 3);
    const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8; pan.connect(ambBus);
    for (let k = 0; k < n; k++) {
      const t = t0 + k * (kestrel ? 0.13 : 0.09 + Math.random() * 0.08);
      const s = node.osc('sine', 3000), base = kestrel ? 3300 : 2600 + Math.random() * 1400;
      s.frequency.setValueAtTime(base, t);
      s.frequency.linearRampToValueAtTime(base * (kestrel ? 1.12 : 1.35), t + 0.035);
      s.frequency.linearRampToValueAtTime(base * 0.92, t + 0.09);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kestrel ? 0.035 : 0.025, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      s.connect(g).connect(pan); s.start(t); s.stop(t + 0.12);
    }
  }
  function gulls() {
    const t0 = ctx.currentTime + 0.05, n = 1 + Math.floor(Math.random() * 3);
    const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8; pan.connect(ambBus);
    for (let k = 0; k < n; k++) {
      const t = t0 + k * 0.32, s = node.osc('sawtooth', 1500), bp = node.filter('bandpass', 1400, 2), g = ctx.createGain();
      s.frequency.setValueAtTime(1350, t); s.frequency.linearRampToValueAtTime(1700, t + 0.06); s.frequency.exponentialRampToValueAtTime(800, t + 0.28);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.02, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      s.connect(bp).connect(g).connect(pan); s.start(t); s.stop(t + 0.32);
    }
  }
  function cricket() {
    const t0 = ctx.currentTime + 0.02, pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 2 - 1; pan.connect(ambBus);
    const f = 4200 + Math.random() * 600;
    for (let k = 0; k < 3; k++) {
      const t = t0 + k * 0.045, s = node.osc('sine', f), g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.012 * cricketLevel, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);

    }
  }

  const A = {
    pluck, strum, pad, flute, bell, tambo, drum, rnd: Math.random,
    chime: () => (chimeQueue > 0 ? (chimeQueue--, true) : false),
  };
  function tick() {
    if (!score) return;
    while (nextTime < ctx.currentTime + 0.2) { score.step(step, nextTime, A); nextTime += score.eighth; step++; }
  }

  return {
    start() { init(); ctx.resume(); if (!timer) timer = setInterval(tick, 25); },
    setVolume(v) { volume = v; if (master && !muted) master.gain.setTargetAtTime(v, ctx.currentTime, 0.05); },
    setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : volume, ctx.currentTime, 0.05); },
    // Nuova musica per la tappa: la vecchia sfuma mentre la nuova entra.

      musicBus.gain.setValueAtTime(0.0001, t);

    ambient(dt) {

      }

    // Rombo del motore, proporzionale alla velocità.

        g.gain.setValueAtTime(0.05, t + b - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + b);

    // Avviso di chiusura porte della metro.
    doors() {

        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.9);
        s.connect(g); out(g, { bus: 'sfx', reverb: 0.4 }); s.start(t + d); s.stop(t + d + 1);

    },
    // Arrivo: l'accordo si risolve in re maggiore, con campana e kaval.
    finale() {
      if (!ctx) return;

      flute(69, t + 3.6, 3, { gain: 0.05, bus: 'sfx' });
    },
  };
})();

const canvas = $('scene');

// Cielo: sfumatura verso l'orizzonte, bagliore del sole e, dal lato opposto, la fascia rosa dell'alba o del tramonto.
function makeSky() {
  const uniforms = {
    top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, glow: { value: new THREE.Color() },
    belt: { value: new THREE.Color() }, ground: { value: new THREE.Color() }, sunColor: { value: new THREE.Color() },
    sunDir: { value: V3(1, 0.1, 0) },
  };
  const mat = new THREE.ShaderMaterial({
    uniforms, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir;
      void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 top, horizon, glow, belt, ground, sunColor, sunDir; varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float h = d.y;
        float toward = dot(normalize(d.xz + 1e-4), normalize(sunDir.xz + 1e-4)) * 0.5 + 0.5;
        vec3 hor = mix(belt, glow, pow(toward, 2.2));
        vec3 col = mix(hor, horizon, smoothstep(0.0, 0.12, h));
        col = mix(col, top, smoothstep(0.08, 0.6, h));
        col = mix(col, ground, smoothstep(0.0, -0.08, h));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunColor * (pow(s, 900.0) * 4.0 + pow(s, 40.0) * 0.35 + pow(s, 6.0) * 0.12);
        gl_FragColor = vec4(col, 1.0);
        #include <colorspace_fragment>
      }`,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), mat); // segue la camera, dentro il piano di fondo
  mesh.frustumCulled = false;
  mesh.renderOrder = -1;
  return { mesh, uniforms };
}
const sky = makeSky();
scene.add(sky.mesh);
// Stelle: compaiono solo quando la sera scende sulla Valle delle Rose.
const starMat = (() => {
  const n = 700, pos = new Float32Array(n * 3), r = rng(99);
  for (let i = 0; i < n; i++) {
    const y = 0.08 + Math.pow(r(), 0.7) * 0.9, a = r() * Math.PI * 2, rr = Math.sqrt(1 - y * y);
    pos.set([Math.cos(a) * rr * 2700, y * 2700, Math.sin(a) * rr * 2700], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0xfff6e8, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
  const p = new THREE.Points(g, m); p.frustumCulled = false; sky.mesh.add(p);
  return m;
})();

const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1.4);

// Tavolozza di una tappa: colori di cielo, nebbia e luci all'inizio e alla fine, interpolati con l'avanzare del viaggio.
const PAIR_KEYS = ['top', 'horizon', 'glow', 'belt', 'fog', 'sun', 'hemiSky'];
function palette(o) {
  const p = { ...o };
  PAIR_KEYS.forEach((k) => { p[k] = o[k].map((h) => C(h)); });
  p.hemiGround = C(o.hemiGround); p.hillTint = C(o.hillTint ?? 0x8d86a0);
  return p;
}
const mixC = (target, pair, k) => target.copy(pair[0]).lerp(pair[1], k);
const sunDirV = V3();
function applyPalette(P, k, focus, hillMat) {
  const elev = lerp(P.elev[0], P.elev[1], k);
  sunDirV.set(P.az[0] * Math.cos(elev), Math.sin(elev), P.az[1] * Math.cos(elev)).normalize();
  const u = sky.uniforms;
  u.sunDir.value.copy(sunDirV);
  mixC(u.top.value, P.top, k); mixC(u.horizon.value, P.horizon, k); mixC(u.glow.value, P.glow, k);
  mixC(u.belt.value, P.belt, k); mixC(u.ground.value, P.fog, k); mixC(u.sunColor.value, P.sun, k);
  mixC(scene.fog.color, P.fog, k); scene.fog.near = P.fogNear ?? 150; scene.fog.far = P.fogFar ?? 1400;
  if (hillMat) hillMat.color.copy(scene.fog.color).lerp(P.hillTint, P.hillMix ?? 0.45);
  mixC(sun.color, P.sun, k); sun.intensity = lerp(P.sunI[0], P.sunI[1], k);
  mixC(hemi.color, P.hemiSky, k); hemi.groundColor.copy(P.hemiGround); hemi.intensity = lerp(P.hemiI[0], P.hemiI[1], k);
  // La luce non arriva mai da sotto l'orizzonte, anche quando il sole è appena tramontato.
  tmpV3.copy(sunDirV); tmpV3.y = Math.max(tmpV3.y, 0.07); tmpV3.normalize();
  sun.position.copy(focus).addScaledVector(tmpV3, 400); sun.target.position.copy(focus);
  starMat.opacity = P.stars ? smooth(P.stars[0], P.stars[1], k) * 0.9 : 0;
}

// Texture morbide disegnate su canvas: bagliori, nebbia, cartelli di stazione.
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);

}
function mistTexture(seed) {

  const g = c.getContext('2d'), r = rng(seed);

    gr.addColorStop(0, `rgba(255,255,255,${0.08 + r() * 0.12})`); gr.addColorStop(1, 'rgba(255,255,255,0)');

}

// Onde di vento sui campi: una fascia più chiara che scorre sui vertici segnati come grano (aWave).
function addWind(mat, strength = 0.22) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = 'attribute float aWave;\nvarying float vWave;\nvarying vec3 vWPos;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\nvWave = aWave;\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform float uTime;\nvarying float vWave;\nvarying vec3 vWPos;\n' + sh.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>
      float wv = pow(sin(vWPos.x * 0.06 + vWPos.z * 0.045 - uTime * 1.4) * 0.5 + 0.5, 3.0);
      diffuseColor.rgb *= 1.0 + vWave * (wv * ${strength.toFixed(2)} - 0.05);`);
  };
  mat.customProgramCacheKey = () => `wind${strength}`;
}

// Finestre disegnate nello shader in coordinate del mondo: nessuna texture, e alcune si accendono (uGlint).
function windowMaterial(glint, lit = 0xffc978, dark = 0x2b3440, floor = 2.9, bay = 3.4, minY = 1.5) {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const f = floor.toFixed(2), b = bay.toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uGlint = glint; sh.uniforms.uLit = { value: C(lit) }; sh.uniforms.uDark = { value: C(dark) };
    sh.vertexShader = 'varying vec3 vWPos;\nvarying vec3 vWN;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      mat4 wmx = modelMatrix;
      #ifdef USE_INSTANCING
        wmx = modelMatrix * instanceMatrix;
      #endif
      vWPos = (wmx * vec4(transformed, 1.0)).xyz;
      vWN = normalize(mat3(wmx) * objectNormal);`);
    sh.fragmentShader = 'uniform float uGlint;\nuniform vec3 uLit, uDark;\nvarying vec3 vWPos;\nvarying vec3 vWN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float side = step(abs(vWN.y), 0.5);
      float wu = abs(vWN.x) > 0.5 ? vWPos.z : vWPos.x;
      float fy = fract(vWPos.y / ${f}), fu = fract(wu / ${b});
      float win = side * step(0.36, fy) * step(fy, 0.8) * step(0.24, fu) * step(fu, 0.72) * step(${minY.toFixed(2)}, vWPos.y);
      float cell = fract(sin(dot(floor(vec3(wu / ${b}, vWPos.y / ${f}, vWN.x * 3.0 + vWN.z * 7.0)), vec3(12.9898, 78.233, 37.719))) * 43758.5453);
      float on = step(0.62, cell) * uGlint;
      diffuseColor.rgb = mix(diffuseColor.rgb, mix(uDark, uLit, on), win * 0.9);
      totalEmissiveRadiance += uLit * on * win * 0.7;`);
  };
  m.customProgramCacheKey = () => `win${f}${b}${minY}`;
  return m;
}

// Mare: onde con normali calcolate nello shader, riflesso del cielo verso l'orizzonte e scintillio del sole.
function makeSea(group, { y = 0, deep = 0x1d5a86, shallow = 0x3a93ad, size = 8000 } = {}) {
  const uniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { deep: { value: C(deep) }, shallow: { value: C(shallow) } }]);
  uniforms.uTime = uTime; uniforms.sunDir = sky.uniforms.sunDir; uniforms.sunColor = sky.uniforms.sunColor; uniforms.horizon = sky.uniforms.horizon;
  const mat = new THREE.ShaderMaterial({
    uniforms, fog: true,
    vertexShader: `varying vec3 vWPos;
      #include <fog_pars_vertex>
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0); vWPos = wp.xyz;
        vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform vec3 deep, shallow, sunColor, sunDir, horizon; uniform float uTime; varying vec3 vWPos;
      #include <fog_pars_fragment>
      void main() {
        vec2 p = vWPos.xz; float t = uTime;

        vec3 col = mix(deep, shallow, clamp(0.45 + g.x * 3.0, 0.0, 1.0));
        col = mix(col, horizon, clamp(fres, 0.0, 0.8));
        vec3 r = reflect(-v, n);

        #include <fog_fragment>

  });

}

// Lo sguardo gira attorno al mezzo (in volo guida l'aereo): trascinare, scorrere col trackpad o le frecce.
const look = { yaw: 0, pitch: 0, ty: 0, tp: 0, touched: false };
const YAW_MAX = 1.9, PITCH_MIN = -0.3, PITCH_MAX = 0.7;
let flightMode = false;
function nudge(dx, dy) {
  look.ty = clamp(look.ty + dx, -YAW_MAX, YAW_MAX);
  look.tp = clamp(look.tp + dy, PITCH_MIN, PITCH_MAX);
  if (!look.touched) { look.touched = true; setTimeout(hideHint, 1800); }
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = e.pointerType === 'touch' ? 0.0065 : 0.0045;
  nudge(-(e.clientX - drag.x) * k, (e.clientY - drag.y) * k * 0.8);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = () => { drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 0.03 : 0.0016;
  nudge(-e.deltaX * k, -e.deltaY * k * 0.7);
}, { passive: false });
const keys = new Set();
addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && !(e.target instanceof HTMLInputElement)) {
    keys.add(e.key); e.preventDefault();
  }
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', (e) => keys.delete(e.key));
function applyKeys(dt) {
  const s = 1.4 * dt, v = flightMode ? -1 : 1; // in volo la freccia su fa salire l'aereo
  if (keys.has('ArrowLeft')) nudge(s, 0);
  if (keys.has('ArrowRight')) nudge(-s, 0);
  if (keys.has('ArrowUp')) nudge(0, s * 0.6 * v);
  if (keys.has('ArrowDown')) nudge(0, -s * 0.6 * v);
}

// Terreno a bassa poligonazione con colori per vertice; wave(x, y, z) segna i vertici su cui passa il vento.
function makeTerrain({ width, length, segX, segZ, height, color, wave, offsetZ = 0 }) {
  const g = new THREE.PlaneGeometry(width, length, segX, segZ);
  g.rotateX(-Math.PI / 2); g.translate(0, 0, offsetZ);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), wv = wave ? new Float32Array(p.count) : null;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = height(x, z);
    p.setY(i, y);
    const c = color(x, y, z); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    if (wv) wv[i] = wave(x, y, z);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  if (wv) g.setAttribute('aWave', new THREE.BufferAttribute(wv, 1));
  g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  if (wave) addWind(mat);
  const mesh = new THREE.Mesh(g, mat);
  mesh.receiveShadow = true;
  return mesh;
}

// Oltre il terreno dettagliato: pianura piatta fino all'orizzonte (a strisce, per lasciare libero il mare) e colline lontane.
function makeHorizon(group, { width, length, ground = 0xb8a672, groundY = 0, hills = true, minX = -4000, minXBack = minX }) {
  const mat = new THREE.MeshLambertMaterial({ color: ground });
  const strips = [[minX, 4000, length / 2 - 2, 4000], [minXBack, 4000, -4000, -length / 2 + 2], [Math.max(minX, width / 2 - 2), 4000, -length / 2 + 2, length / 2 - 2]];
  if (minX < -width / 2) strips.push([minX, -width / 2 + 2, -length / 2 + 2, length / 2 - 2]);
  strips.forEach(([x0, x1, z0, z1]) => {
    if (x1 <= x0 || z1 <= z0) return;
    const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0); g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat); m.position.set((x0 + x1) / 2, groundY, (z0 + z1) / 2);
    group.add(m);
  });
  if (!hills) return { hillMat: null };
  const hv = [], hi = [], seg = 160;
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2, hh = 30 + 26 * Math.sin(a * 3 + 1) * Math.sin(a * 7 + 0.4) + 14 * Math.sin(a * 13);
    hv.push(Math.cos(a) * 2200, -2, Math.sin(a) * 2200, Math.cos(a) * 2400, Math.max(8, hh), Math.sin(a) * 2400);
  }
  for (let i = 0; i < seg; i++) { const a = i * 2; hi.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const hg = new THREE.BufferGeometry();
  hg.setAttribute('position', new THREE.Float32BufferAttribute(hv, 3)); hg.setIndex(hi); hg.computeVertexNormals();
  const hillMat = new THREE.MeshBasicMaterial({ color: 0x9d93a8, side: THREE.DoubleSide });
  group.add(new THREE.Mesh(hg, hillMat));
  return { hillMat };
}

// Binario lungo una curva: rotaie, traversine, massicciata oppure viadotto con piloni.
function makeTrack(group, { trackX, trackY, viaduct, ground, z0 = 560, z1 = -560 }) {
  const pts = [];
  for (let z = z0; z >= z1; z -= 8) pts.push(V3(trackX(z), trackY(z), z));
  const curve = new THREE.CatmullRomCurve3(pts), L = curve.getLength();
  const frameAt = (u) => {
    const p = curve.getPointAt(u), t = curve.getTangentAt(u);
    return { p, t, r: V3().crossVectors(t, UP).normalize() };
  };
  const railPts = [[], []], bedV = [], bedI = [], samples = Math.floor(L / 2);
  for (let i = 0; i <= samples; i++) {
    const { p, r } = frameAt(i / samples);
    railPts[0].push(p.clone().addScaledVector(r, -0.72).add(V3(0, 0.32, 0)));
    railPts[1].push(p.clone().addScaledVector(r, 0.72).add(V3(0, 0.32, 0)));
    const w = viaduct ? 2.8 : 2.3, a = p.clone().addScaledVector(r, -w), b = p.clone().addScaledVector(r, w);
    if (viaduct) {
      bedV.push(a.x, a.y - 0.05, a.z, b.x, b.y - 0.05, b.z, a.x, a.y - 1.5, a.z, b.x, b.y - 1.5, b.z);
      if (i < samples) {
        const k = i * 4;
        bedI.push(k, k + 1, k + 4, k + 1, k + 5, k + 4, k, k + 4, k + 2, k + 2, k + 4, k + 6, k + 1, k + 3, k + 5, k + 3, k + 7, k + 5);
      }
    } else {
      bedV.push(a.x, a.y - 0.02, a.z, b.x, b.y - 0.02, b.z);
      if (i < samples) { const k = i * 2; bedI.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    }
  }
  const railMat = new THREE.MeshLambertMaterial({ color: 0x8c8f94 });
  railPts.forEach((rp) => group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp), samples, 0.09, 4), railMat)));
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute(bedV, 3)); bg.setIndex(bedI); bg.computeVertexNormals();
  const bed = new THREE.Mesh(bg, new THREE.MeshLambertMaterial({ color: viaduct ? 0xb9b5ab : 0x7f7a72, side: THREE.DoubleSide }));
  bed.receiveShadow = true; bed.castShadow = !!viaduct;
  group.add(bed);
  const sleeperCount = Math.floor(L / 1.3);
  const sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(2.5, 0.18, 0.45), new THREE.MeshLambertMaterial({ color: 0x6d6258 }), sleeperCount);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < sleeperCount; i++) {
    const { p, t, r } = frameAt(i / sleeperCount);
    m4.makeBasis(r, UP, t).setPosition(p.x, p.y + 0.12, p.z);
    sleepers.setMatrixAt(i, m4);
  }
  sleepers.receiveShadow = true;
  group.add(sleepers);
  if (viaduct) {
    const n = Math.floor(L / 16), pil = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.9, 1.1, 1, 8), new THREE.MeshLambertMaterial({ color: 0xaaa69c }), n);
    const d = new THREE.Object3D();
    for (let i = 0; i < n; i++) {
      const { p } = frameAt((i + 0.5) / n), gy = ground(p.x, p.z) - 1, h = Math.max(1, p.y - 1.5 - gy);
      d.position.set(p.x, gy + h / 2, p.z); d.scale.set(1, h, 1); d.updateMatrix(); pil.setMatrixAt(i, d.matrix);
    }
    pil.castShadow = pil.receiveShadow = true;
    group.add(pil);
  }
  return {
    curve, L, frameAt,
    pointAt: (s) => curve.getPointAt(clamp(s / L, 0, 1)),
    tangentAt: (s) => curve.getTangentAt(clamp(s / L, 0, 1)),
  };
}

// Carrozze: cassa, fascia vetri, bande di colore della compagnia, carrelli; in testa il muso (o la cabina piatta della metro).
const LIVERY = {
  fal: { body: 0xf1f1ec, band: 0x1f4e8c },
  fnb: { body: 0xf3f3f1, band: 0xc0302a, lower: 0x4c535b, roof: 0xa3a8ad },
  metro: { body: 0xd9dde2, band: 0x1b5fa8, roof: 0xb4b9bf, metro: true },
  bdz: { body: 0xf2f1ec, band: 0x2f7a4b, stripe: 0xc0302a },

function makeCar(L, front, len) {
  const g = new THREE.Group();
  const M = (c, e) => new THREE.MeshLambertMaterial({ color: c, ...(e ? { emissive: e } : {}) });
  const glass = M(0x223140, L.glow ?? 0x4a3a22), band = M(L.band), dark = M(0x2c3036);
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  add(box(3, 3.2, len), M(L.body), 0, 2.35, 0);
  add(box(3.04, 0.95, len - 2.8), glass, 0, 2.95, 0.4);
  add(box(3.06, 0.42, len + 0.02), band, 0, 1.45, 0);
  if (L.stripe) add(box(3.07, 0.14, len + 0.04), M(L.stripe), 0, 1.8, 0);
  if (L.lower) add(box(3.05, 0.5, len + 0.01), M(L.lower), 0, 0.95, 0);
  add(box(2.5, 0.4, len - 1.5), M(L.roof ?? 0x9aa0a6), 0, 4.1, 0);
  add(box(2.3, 0.8, 2.8), dark, 0, 0.6, len / 2 - 2.9);
  add(box(2.3, 0.8, 2.8), dark, 0, 0.6, -len / 2 + 2.9);
  if (front) {
    if (L.metro) add(box(2.9, 1.9, 0.12), glass, 0, 2.9, -len / 2 - 0.04);
    else { const nose = add(box(2.96, 1.5, 0.3), glass, 0, 3.05, -len / 2 - 0.12); nose.rotation.x = 0.28; }
    add(box(3.02, 0.6, 0.25), band, 0, 1.45, -len / 2 - 0.05);
    const lamp = new THREE.MeshBasicMaterial({ color: 0xfff1c9 });
    add(box(0.45, 0.3, 0.1), lamp, -0.95, 1.95, -len / 2 - 0.03);
    add(box(0.45, 0.3, 0.1), lamp, 0.95, 1.95, -len / 2 - 0.03);

function makeTrain(group, track, livery, n = 2, len = 17) {
  const cars = Array.from({ length: n }, (_, i) => makeCar(livery, i === 0, len));
  cars.forEach((c) => group.add(c));
  const place = (s) => cars.forEach((c, i) => {
    const ss = s - i * (len + 0.6), p = track.pointAt(ss), t = track.tangentAt(ss);
    c.position.set(p.x, p.y + 0.25, p.z);
    c.lookAt(p.x - t.x, p.y + 0.25 - t.y, p.z - t.z);
  });
  return { cars, place };
}

// Aereo di linea stilizzato: fusoliera bianca, deriva magenta come la linea del volo del sito. Il muso guarda verso -z.
function makePlane() {
  const g = new THREE.Group();
  const white = new THREE.MeshLambertMaterial({ color: 0xf3f4f6 }), grey = new THREE.MeshLambertMaterial({ color: 0xa5adb6 });
  const tail = new THREE.MeshLambertMaterial({ color: 0xb3246f }), glass = new THREE.MeshLambertMaterial({ color: 0x1d2a36 });
  const add = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  add(new THREE.CylinderGeometry(1.9, 1.9, 26, 16), white).rotation.x = Math.PI / 2;
  const nose = add(new THREE.SphereGeometry(1.9, 16, 10), white, 0, 0, -13); nose.scale.set(1, 1, 2.1);
  add(new THREE.ConeGeometry(1.9, 9, 16), white, 0, 0.35, 17.4).rotation.x = Math.PI / 2;
  add(new THREE.BoxGeometry(3.86, 0.28, 20), glass, 0, 0.55, 0);
  add(new THREE.BoxGeometry(2.4, 0.55, 1.2), glass, 0, 0.95, -15.4).rotation.x = -0.35;
  const wingShape = new THREE.Shape([[-16, 1.2], [-1.8, -3], [1.8, -3], [16, 1.2], [16, 2.6], [1.8, 2.8], [-1.8, 2.8], [-16, 2.6]].map(([x, y]) => new THREE.Vector2(x, y)));
  add(new THREE.ExtrudeGeometry(wingShape, { depth: 0.35, bevelEnabled: false }), white, 0, -0.9, 1).rotation.x = Math.PI / 2;
  [-6.2, 6.2].forEach((x) => { add(new THREE.CylinderGeometry(0.85, 0.85, 3.6, 12), grey, x, -1.9, -0.8).rotation.x = Math.PI / 2; });
  const finShape = new THREE.Shape([[0, 0], [4.5, 7.2], [7.2, 7.2], [7.8, 0]].map(([x, y]) => new THREE.Vector2(x, y)));
  add(new THREE.ExtrudeGeometry(finShape, { depth: 0.35, bevelEnabled: false }), tail, 0.17, 1.6, 12.5).rotation.y = -Math.PI / 2;

// Stazione: marciapiede, fabbricato (o pensilina sul viadotto) e cartello con il nome.
function makeStation(api, { s, lines, side = -1, building = 0xdcc59a, roof = 0xa4553b, big = false, elevated = false, sign = '#1f4e8c' }) {
  const { group, track } = api, { p, t, r } = track.frameAt(clamp(s / track.L, 0, 1));
  const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(r, UP, t));
  const add = (m) => { m.castShadow = m.receiveShadow = true; group.add(m); return m; };
  const platform = add(new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.9, 46), new THREE.MeshLambertMaterial({ color: 0xbdb5a5 })));
  platform.position.copy(p).addScaledVector(r, 3.5 * side).add(V3(0, 0.45, 0)); platform.quaternion.copy(q);
  if (elevated) {
    const canopy = add(new THREE.Mesh(new THREE.BoxGeometry(5, 0.3, 40), new THREE.MeshLambertMaterial({ color: 0x9ea7b0 })));
    canopy.position.copy(platform.position).add(V3(0, 4.2, 0)); canopy.quaternion.copy(q);
    [-15, 0, 15].forEach((o) => {
      const post = add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 3.8, 0.25), new THREE.MeshLambertMaterial({ color: 0x5b6570 })));
      post.position.copy(platform.position).addScaledVector(t, o).add(V3(0, 2.3, 0));
    });
  } else {
    const W = big ? 12 : 8, H = big ? 9 : 6, D = big ? 40 : 18;
    const st = add(new THREE.Mesh(new THREE.BoxGeometry(W, H, D), new THREE.MeshLambertMaterial({ color: building })));
    st.position.copy(p).addScaledVector(r, (6.5 + W / 2) * side).add(V3(0, H / 2, 0)); st.quaternion.copy(q);
    const roofShape = new THREE.Shape([V3(-W / 2 - 0.6, 0), V3(W / 2 + 0.6, 0), V3(0, W * 0.3)].map((v) => new THREE.Vector2(v.x, v.y)));
    const rf = add(new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: D + 1, bevelEnabled: false }), new THREE.MeshLambertMaterial({ color: roof })));
    rf.geometry.translate(0, 0, -(D + 1) / 2); rf.position.copy(st.position).add(V3(0, H / 2, 0)); rf.quaternion.copy(q);
  }
  const h = lines.length > 1 ? 2 : 1.3;
  const signMesh = new THREE.Mesh(new THREE.PlaneGeometry(6, h), new THREE.MeshBasicMaterial({ map: signTexture(lines, sign), side: THREE.DoubleSide }));
  signMesh.position.copy(p).addScaledVector(r, 4.2 * side).addScaledVector(t, 16).add(V3(0, 3.6 + (elevated ? 0.6 : 0), 0));
  signMesh.lookAt(signMesh.position.clone().sub(t));
  group.add(signMesh);
  const postMat = new THREE.MeshLambertMaterial({ color: 0x3b4650 });
  [-2.4, 2.4].forEach((o) => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 3.2, 0.15), postMat);
    post.position.copy(signMesh.position).addScaledVector(r, o).add(V3(0, -1.6 - h / 2 + 0.65, 0));
    group.add(post);
  });
}

  round: { trunk: [0.35, 0.5, 3.4, 5], crown: () => new THREE.IcosahedronGeometry(3, 1), ty: 1.6, cy: 5, sx: [1, 1.3], sy: [0.9, 1.2] },

  palm: { trunk: [0.3, 0.45, 9, 6], crown: () => new THREE.IcosahedronGeometry(2.8, 0), ty: 4.5, cy: 9.2, sx: [1.3, 1.5], sy: [0.35, 0.45] },
};
function makeTrees(api, { n, ok, kind = 'olive', crown = 0x7f8f5c, trunk = 0x5d4a3a, groves = 14, points, spread }) {
  const { R, height, group, TW, TL } = api, sh = TREE_SHAPES[kind];
  const count = points ? points.length : n;
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(...sh.trunk), new THREE.MeshLambertMaterial({ color: trunk }), count);
  const crowns = new THREE.InstancedMesh(sh.crown(), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), count);
  const d = new THREE.Object3D(), c = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < count && guard++ < 30000) {
    let x, z;
    if (points) { ({ x, z } = points[placed]); } else {
      const grove = Math.floor(R() * groves), gx = Math.sin(grove * 12.9) * TW * 0.3, gz = Math.cos(grove * 7.3) * TL * 0.38;
      x = R() < 0.6 ? gx + (R() - 0.5) * (spread ?? 140) : (R() - 0.5) * TW;
      z = R() < 0.6 ? gz + (R() - 0.5) * (spread ?? 140) : (R() - 0.5) * TL;
      if (!ok(x, z)) continue;
    }
    const y = height(x, z), s = 0.8 + R() * 0.6;
    d.position.set(x, y + sh.ty * s, z); d.rotation.set(0, R() * 6, (R() - 0.5) * 0.2); d.scale.set(s, s, s); d.updateMatrix();
    trunks.setMatrixAt(placed, d.matrix);
    d.position.set(x, y + sh.cy * s, z);
    d.scale.set(s * lerp(sh.sx[0], sh.sx[1], R()), s * lerp(sh.sy[0], sh.sy[1], R()), s * lerp(sh.sx[0], sh.sx[1], R()));
    d.updateMatrix(); crowns.setMatrixAt(placed, d.matrix);
    crowns.setColorAt(placed, c.setHex(crown).offsetHSL((R() - 0.5) * 0.03, (R() - 0.5) * 0.1, (R() - 0.5) * 0.08));
    placed++;
  }
  trunks.count = crowns.count = placed;
  trunks.castShadow = crowns.castShadow = true;
  group.add(trunks, crowns);
}

// Muretti a secco: tratti corti appoggiati al punto più basso, così sul pendio affondano un po' invece di galleggiare.
function makeWalls(api, { n, ok, color = 0xddd0b0 }) {
  const { R, height, group, TW, TL } = api;
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color, flatShading: true }), n);
  const d = new THREE.Object3D();
  let wp = 0, guard = 0;
  while (wp < n && guard++ < 20000) {
    const x = (R() - 0.5) * TW, z = (R() - 0.5) * TL;
    const ang = (R() < 0.5 ? 0.35 : 0.35 + Math.PI / 2) + (R() - 0.5) * 0.1, len = 6 + R() * 6;
    const x2 = x + Math.cos(ang) * len, z2 = z + Math.sin(ang) * len;
    if (!ok(x, z) || !ok(x2, z2)) continue;
    const mx = (x + x2) / 2, mz = (z + z2) / 2;
    d.position.set(mx, Math.min(height(x, z), height(x2, z2), height(mx, mz)) + 0.35, mz); d.rotation.set(0, -ang, 0); d.scale.set(len, 1.1, 0.7); d.updateMatrix();
    walls.setMatrixAt(wp++, d.matrix);
  }
  walls.count = wp;
  walls.receiveShadow = true;
  group.add(walls);
}

// Uccelli che girano in tondo: rondini, grillai, gabbiani.
function makeBirds(api, { n, color = 0x6b4630, center }) {
  const { R, group } = api;
  const mat = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
  const wing = new THREE.BufferGeometry();
  wing.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -0.35, 1.9, 0, 0.1, 0, 0, 0.45], 3));
  wing.computeVertexNormals();
  const body = new THREE.ConeGeometry(0.22, 1.3, 4);
  const birds = [];
  for (let i = 0; i < n; i++) {
    const b = new THREE.Group(), wl = new THREE.Mesh(wing, mat), wr = new THREE.Mesh(wing, mat), bm = new THREE.Mesh(body, mat);
    wr.scale.x = -1; bm.rotation.x = Math.PI / 2; b.add(wl, wr, bm);
    b.userData = { ...center(i, R), sp: (0.25 + R() * 0.25) * (R() < 0.5 ? 1 : -1), ph: R() * 6, wl, wr };
    birds.push(b); group.add(b);
  }
  return (clock) => birds.forEach((b) => {
    const u = b.userData, a = u.ph + clock * u.sp;
    b.position.set(u.cx + Math.cos(a) * u.rad, u.y + Math.sin(clock * 0.7 + u.ph) * 2, u.cz + Math.sin(a) * u.rad);
    b.rotation.y = -a + (u.sp > 0 ? 0 : Math.PI);
    b.rotation.z = u.sp > 0 ? -0.25 : 0.25;
    const flap = Math.sin(clock * 11 + u.ph) * 0.5;
    u.wl.rotation.z = flap; u.wr.rotation.z = -flap;
  });
}

// Edifici a blocchi (una sola chiamata di disegno) e tetti a padiglione.
function makeBlocks(group, list, mat) {
  const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat, list.length);
  const d = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((b, i) => {
    d.position.set(b.x, b.y + b.h / 2, b.z); d.rotation.set(0, b.rot ?? 0, 0); d.scale.set(b.w, b.h, b.d); d.updateMatrix();
    m.setMatrixAt(i, d.matrix); m.setColorAt(i, c.setHex(b.color));
  });
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  return m;
}
function makeRoofs(group, list, color) {
  const geo = new THREE.ConeGeometry(0.7071, 1, 4); geo.rotateY(Math.PI / 4);
  const m = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color, flatShading: true }), list.length);
  const d = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((b, i) => {
    const rh = b.roofH ?? Math.min(b.w, b.d) * 0.42;
    d.position.set(b.x, b.y + b.h + rh / 2, b.z); d.rotation.set(0, b.rot ?? 0, 0); d.scale.set(b.w * 1.08, rh, b.d * 1.08); d.updateMatrix();
    m.setMatrixAt(i, d.matrix); m.setColorAt(i, c.setHex(color).offsetHSL(0, 0, (hash2(b.x, b.z) - 0.5) * 0.08));
  });
  m.castShadow = true;
  group.add(m);
}

// Camera che orbita dietro e a destra del mezzo e guarda oltre, a sinistra: lì c'è sempre il paesaggio della tappa.
function orbitCamera(o) {
  const right = V3(), focus = V3(), want = V3(), aim = V3(), pos = V3(), tgt = V3();
  let init = false;
  return (dt, fp, tangent, clock, speedK) => {
    right.crossVectors(tangent, UP).normalize();
    const bx = -tangent.x * 0.72 + right.x * (o.side ?? 0.7), bz = -tangent.z * 0.72 + right.z * (o.side ?? 0.7);
    const yaw = Math.atan2(bx, bz) + look.yaw, pitch = o.pitch + look.pitch;
    focus.copy(fp); focus.y += o.focusY ?? 3;
    want.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(o.dist).add(focus);
    if (o.ground) want.y = Math.max(want.y, o.ground(want.x, want.z) + (o.minAbove ?? 2.5));
    aim.set(-Math.sin(yaw) * o.lookDist, -o.lookDown - look.pitch * 10, -Math.cos(yaw) * o.lookDist).add(focus);
    if (!init) { pos.copy(want); tgt.copy(aim); init = true; }
    const damp = 1 - Math.exp(-dt * 3.2);
    pos.lerp(want, damp); tgt.lerp(aim, damp);
    camera.position.copy(pos);
    if (!reducedMotion) camera.position.y += Math.sin(clock * 1.7) * 0.02 * speedK;
    camera.lookAt(tgt);
  };
}

// Tappa in treno: terreno, binario, treno, luce che cambia, camera e "sguardo che risveglia". Il resto lo mette decorate().
function railLeg(o) {
  const group = new THREE.Group(), R = rng(o.seed);
  const TW = o.width ?? 1400, TL = o.length ?? 1600;
  const { trackX, trackY } = o;
  const height = o.viaduct ? o.height : (x, z) => {
    const h = o.height(x, z), k = 1 - smooth(3.5, 12, Math.abs(x - trackX(z)));
    return h * (1 - k) + (trackY(z) - 0.35) * k;
  };
  const ballast = C(o.ballast ?? 0x8e887e);
  const colorAt = (x, y, z) => (!o.viaduct && Math.abs(x - trackX(z)) < 2.6 ? tmpC.copy(ballast) : o.color(x, y, z));
  group.add(makeTerrain({ width: TW, length: TL, segX: coarse ? 200 : 280, segZ: coarse ? 230 : 320, height, color: colorAt, wave: o.wave }));
  const horizon = makeHorizon(group, { width: TW, length: TL, ...o.horizon });
  const track = makeTrack(group, { trackX, trackY, viaduct: o.viaduct, ground: height });
  const train = makeTrain(group, track, o.livery, o.cars ?? 2, o.carLength ?? 17);
  const api = { group, R, height, track, trackX, TW, TL };
  const deco = o.decorate(api) ?? {};
  const targets = deco.targets ?? [], hit = new Array(targets.length).fill(false);
  const label = LEGS[o.index].counter;
  let count = 0;
  setCounter(label, 0, targets.length);

  const S0 = o.startS ?? 30, END = track.L - (o.endMargin ?? 70), V = o.speed ?? 13.5;
  let s = S0, speed = o.rolling ? V : 0, clock = 0, departed = !!o.rolling, finished = false, clackAt = 0;
  train.place(s);
  const cam = orbitCamera({ dist: coarse ? 42 : 38, pitch: 0.36, lookDist: 40, lookDown: 12, ground: height, ...o.camera });
  const fwd = V3(), tv = V3();

  function update(dt, active) {
    clock += dt;
    if (active && !departed && clock > 3.5) { departed = true; if (o.metro) Sound.doors(); else Sound.horn(); }
    let target = !departed ? 0 : V;
    if (s > END) target = o.stopAtEnd ? 0 : 5;
    if (o.stopAtEnd && s > END - 55) target = V * clamp((END + 6 - s) / 50, 0, 1);
    speed = lerp(speed, target, 1 - Math.exp(-dt * (departed && speed < 4 && target > 4 ? 0.35 : 0.6)));
    s = Math.min(s + speed * dt, track.L - 20);
    train.place(s);
    Sound.engine(o.metro ? speed * 0.6 : speed);
    if (speed > 0.5 && s > clackAt) { Sound.clack(speed); clackAt = s + (o.metro ? 14 : 18); }

    const prog = clamp((s - S0) / (END - S0), 0, 1);
    $('legprogress').style.width = `${(prog * 100).toFixed(1)}%`;
    const done = o.stopAtEnd ? s > END - 4 && speed < 1.2 : s >= END;
    if (!finished && done) { finished = true; finishLeg(); }

    const k = smooth(0, 1, prog), fp = train.cars[0].position;
    applyPalette(o.palette, k, fp, horizon.hillMat);
    cam(dt, fp, track.tangentAt(s), clock, speed / V);
    deco.update?.(dt, clock, k, prog, s);

    if (active && targets.length) {
      camera.updateMatrixWorld();
      camera.getWorldDirection(fwd);
      for (let i = 0; i < targets.length; i++) {
        if (hit[i]) continue;
        tv.subVectors(targets[i], camera.position);
        const d = tv.length();
        if (d > (o.gazeDist ?? 340)) continue;
        if (o.gazeBox) {
          // Cose sparse nei campi: basta che siano nella parte centrale dello schermo.
          if (tv.dot(fwd) <= 0) continue;
          tv.copy(targets[i]).project(camera);
          if (Math.abs(tv.x) > o.gazeBox[0] || Math.abs(tv.y) > o.gazeBox[1]) continue;
        } else if (tv.dot(fwd) / d < (o.gazeCos ?? 0.989)) continue;
        hit[i] = true; count++;
        deco.onGaze?.(i, clock); Sound.chime(); setCounter(label, count, targets.length);
      }
    }
  }
  return { group, update, score: o.score, summary: () => o.summary(count, targets.length) };
}

// Arpeggi pizzicati su un giro d'accordi (tappa 1).
function arpScore(o) {
  return {
    eighth: o.eighth, amb: o.amb,
    step(i, t, A) {
      const per = 16, chord = o.chords[Math.floor(i / per) % o.chords.length];
      if (i % per === 0) A.pad(chord.slice(1, 4), t, per * o.eighth, { gain: o.padGain, cutoff: o.padCutoff });
      const pos = i % o.pattern.length;
      if (pos === 0) A.pluck(chord[0], t, { gain: 0.13, dur: 2.6, bright: 900, echo: 0.1 });
      const p = o.pattern[pos];
      if (p !== null && A.rnd() > o.skip) A.pluck(chord[p] + 12, t, { gain: 0.1 + A.rnd() * 0.03, dur: 1.5, pan: (A.rnd() - 0.5) * 0.5 });
      if (A.rnd() < o.sparkle) A.pluck(chord[2 + Math.floor(A.rnd() * 3)] + 24, t + o.eighth / 2, { gain: 0.035, dur: 1.2, bright: 5200, reverb: 0.6 });
      if (A.chime()) {
        A.pluck(chord[2 + Math.floor(A.rnd() * 3)] + 24, t, { bus: 'sfx', gain: 0.11, dur: 2.4, bright: 6000, shimmer: 0.45, reverb: 0.7, pan: (A.rnd() - 0.5) * 0.8 });
      }
    },
  };
}
// Melodia di kaval: passeggiata a gradi congiunti su una scala, con un po' di silenzi.
function kavalWalk(scale, start) {
  let idx = scale.indexOf(start);
  return (A) => { idx = clamp(idx + [-2, -1, -1, 0, 1, 1, 2][Math.floor(A.rnd() * 7)], 0, scale.length - 1); return scale[idx]; };
}
