/* ============================== Tappa 1: Gravina in Puglia, all'alba ============================== */
function buildGravina() {
  // La gravina: un burrone che serpeggia lungo z. Il treno corre sul ciglio est, la città sta sul ciglio ovest.
  const RH = 27, RD = 50, TW = 1400, TL = 1600;
  const ravineX = (z) => 55 * Math.sin(z * 0.0055) + 16 * Math.sin(z * 0.0171 + 1.3);
  const trackX = (z) => ravineX(z) + 66;
  const plateau = (x, z) => 2.2 * Math.sin(x * 0.013 + 0.7) * Math.cos(z * 0.011) + 1.2 * Math.sin(x * 0.041 + z * 0.027) + 0.45 * Math.sin(x * 0.13 - z * 0.11);
  function height(x, z) {
    const edge = 1 - smooth(0.82, 1, Math.max(Math.abs(x) / (TW / 2), Math.abs(z) / (TL / 2)));
    let h = plateau(x, z) * edge;
    const d = Math.abs(x - ravineX(z)), depth = RD * (1 - smooth(560, 760, Math.abs(z)));
    if (d < RH) {
      const t = d / RH, k = 1 - smooth(0.4, 0.93, t), terr = Math.sin(t * 15 + z * 0.05) * 1.6;
      h = h * (1 - k) - depth * k + terr * k * (1 - k) * 2.2;
    }
    return h;
  }
  // Campi della Murgia a toppe, pareti di tufo a strati, fondo verde.
  const fields = [C(0xd4b576), C(0xbcab62), C(0x9a7d52), C(0x9fae62), C(0xc9a862), C(0xdcc38a)];
  const tufa = C(0xd4be94), tufaDark = C(0xb09772), bush = C(0x76804a), bottom = C(0x6b7846), town = C(0xcfc2a2);
  function color(x, y, z) {
    const d = Math.abs(x - ravineX(z));
    if (d < RH && y < -2) {
      if (y < -RD + 7) return tmpC.copy(bottom).lerp(bush, hash2(Math.floor(x / 9), Math.floor(z / 9)) * 0.6);
      tmpC.copy(tufa).lerp(tufaDark, (Math.sin(y * 0.8 + Math.sin(z * 0.03) * 2) * 0.5 + 0.5) * 0.7);
      if (hash2(Math.floor(x / 6), Math.floor(z / 6)) > 0.72) tmpC.lerp(bush, 0.6);
      return tmpC;
    }
    if (z > -80 && z < 170 && x < ravineX(z) - RH + 4 && x > ravineX(z) - RH - 105) return tmpC.copy(town);
    const cx = Math.floor((x + 0.35 * z) / 74), cz = Math.floor((z - 0.22 * x) / 58);
    tmpC.copy(fields[Math.floor(hash2(cx, cz) * fields.length)]);
    return tmpC.multiplyScalar(0.94 + hash2(Math.floor(x / 5), Math.floor(z / 5)) * 0.1);
  }

  return railLeg({
    index: 0, seed: 7, width: TW, length: TL, height, color, trackX, trackY: (z) => 1.1 * Math.sin(z * 0.0047),
    livery: LIVERY.fal, palette: PAL.dawn(), score: SCORE.gravina(), horizon: { ground: 0xb8a672 },
    summary: (n, t) => (n ? `Hai acceso ${n} case di Gravina su ${t}. Il treno prosegue verso Altamura e la Murgia.` : 'Il treno prosegue verso Altamura e la Murgia.'),
    decorate(api) {
      const { group, R } = api, h = api.height;
      makeStation(api, { s: 30, lines: ['Gravina in Puglia'] });

      // La città sul ciglio ovest: case di tufo e le case scavate che scendono nella gravina.
      const houseList = [];
      for (let z = -70; z < 165; z += 5.5) {
        for (let k = 0; k < 16; k++) {
          if (R() < 0.34) continue;
          const w = 4 + R() * 3.5, dpt = 4 + R() * 4, hgt = 4 + R() * 7;
          const x = ravineX(z) - RH - 1.5 - k * 6.5 - R() * 2, zz = z + (R() - 0.5) * 2.5;
          houseList.push({ x, z: zz, w, d: dpt, h: hgt, y: h(x, zz), rim: k === 0 });
        }
      }
      for (let z = -40; z < 150; z += 4.2) {
        if (R() < 0.4) continue;
        const t = 0.5 + R() * 0.42, x = ravineX(z) - t * RH;
        houseList.push({ x, z: z + (R() - 0.5) * 2, w: 3.4 + R() * 1.6, d: 3.5 + R() * 2, h: 3 + R() * 2, y: h(x, z), rim: true });
      }
      const houses = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff }), houseList.length);
      const hc = new THREE.Color(), dummy = new THREE.Object3D();
      const windows = [], windowHouse = [], houseColors = [];
      houseList.forEach((b, i) => {
        dummy.position.set(b.x, b.y - 1.2 + b.h / 2, b.z);
        dummy.rotation.set(0, (R() - 0.5) * 0.12, 0);
        dummy.scale.set(b.w, b.h + 2.4, b.d);
        dummy.updateMatrix();
        houses.setMatrixAt(i, dummy.matrix);
        hc.setHex([0xdcc8a0, 0xe8d8b5, 0xcfb78d, 0xd8c091, 0xefe3c8][Math.floor(R() * 5)]);
        houses.setColorAt(i, hc); houseColors.push(hc.clone());
        if (b.rim) { windows.push(V3(b.x + b.w / 2 + 0.06, b.y - 1.2 + (b.h + 2.4) * 0.5 + 0.6, b.z + (R() - 0.5) * b.d * 0.3)); windowHouse.push(i); }
      });
      houses.castShadow = houses.receiveShadow = true;
      group.add(houses);

      // Cattedrale sul ciglio: navata, campanile con cuspide, rosone.
      {
        const cz = 58, cx = ravineX(cz) - RH - 16, cy = h(cx, cz);
        const stone = new THREE.MeshLambertMaterial({ color: 0xe2d2ae });
        const nave = new THREE.Mesh(new THREE.BoxGeometry(12, 13, 32), stone); nave.position.set(cx, cy + 5.5, cz);
        const roofShape = new THREE.Shape([new THREE.Vector2(-6.8, 0), new THREE.Vector2(6.8, 0), new THREE.Vector2(0, 4.2)]);
        const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: 33, bevelEnabled: false }), new THREE.MeshLambertMaterial({ color: 0x9a6a4c }));
        roof.geometry.translate(0, 0, -16.5); roof.position.set(cx, cy + 12, cz);
        const tower = new THREE.Mesh(new THREE.BoxGeometry(6, 30, 6), stone); tower.position.set(cx + 2, cy + 14, cz - 19);
        const spire = new THREE.Mesh(new THREE.ConeGeometry(4.3, 9, 4), new THREE.MeshLambertMaterial({ color: 0x9a6a4c }));
        spire.rotation.y = Math.PI / 4; spire.position.set(cx + 2, cy + 33.5, cz - 19);
        const rose = new THREE.Mesh(new THREE.CircleGeometry(1.6, 16), new THREE.MeshBasicMaterial({ color: 0x3a2c22 }));
        rose.position.set(cx + 6.05, cy + 8, cz); rose.rotation.y = Math.PI / 2;
        [nave, roof, tower, spire].forEach((m) => { m.castShadow = m.receiveShadow = true; });
        group.add(nave, roof, tower, spire, rose);
        windows.push(V3(cx + 6.1, cy + 8, cz)); windowHouse.push(-1);
      }

      // Finestre: spente all'inizio, si accendono quando entrano al centro dello sguardo; la facciata si scalda.
      const winMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.6, 2.2), new THREE.MeshBasicMaterial({ color: 0xffffff }), windows.length);
      const unlit = C(0x3a2e26), lit = C(0xffc56b), warm = C(0xffc98a);
      const glowPos = new Float32Array(windows.length * 3), glowCol = new Float32Array(windows.length * 3);
      windows.forEach((w, i) => {
        dummy.position.copy(w); dummy.rotation.set(0, Math.PI / 2, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
        winMesh.setMatrixAt(i, dummy.matrix); winMesh.setColorAt(i, unlit);
        glowPos.set([w.x + 0.4, w.y, w.z], i * 3);
      });
      group.add(winMesh);
      const glowGeo = new THREE.BufferGeometry();
      glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
      glowGeo.setAttribute('color', new THREE.BufferAttribute(glowCol, 3));
      group.add(new THREE.Points(glowGeo, new THREE.PointsMaterial({ size: 16, map: glowTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
      const litAt = new Array(windows.length).fill(-1);

      // Il ponte acquedotto: un muro di tufo con arcate che attraversa la gravina.
      {
        const zb = -205, xb = ravineX(zb), W = RH * 2 + 18;
        const shape = new THREE.Shape([new THREE.Vector2(-W / 2, -RD - 4), new THREE.Vector2(W / 2, -RD - 4), new THREE.Vector2(W / 2, 2.5), new THREE.Vector2(-W / 2, 2.5)]);
        const n = 6, span = (W - 16) / n;
        for (let i = 0; i < n; i++) {
          const x0 = -W / 2 + 8 + i * span + 1.6, x1 = x0 + span - 3.2, spring = -9 - Math.abs(i - (n - 1) / 2) * 1.5;
          const hole = new THREE.Path();
          hole.moveTo(x0, -RD - 3); hole.lineTo(x1, -RD - 3); hole.lineTo(x1, spring);
          hole.absarc((x0 + x1) / 2, spring, (x1 - x0) / 2, 0, Math.PI, false);
          hole.lineTo(x0, -RD - 3);
          shape.holes.push(hole);
        }
        const bridge = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 5, bevelEnabled: false }), new THREE.MeshLambertMaterial({ color: 0xd0b98f }));
        bridge.geometry.translate(0, 0, -2.5);
        bridge.position.set(xb, 0, zb);
        bridge.rotation.y = -Math.atan((ravineX(zb + 1) - ravineX(zb - 1)) / 2);
        bridge.castShadow = bridge.receiveShadow = true;
        group.add(bridge);
      }

      // Ulivi e muretti a secco sul pianoro.
      const ok = (margin) => (x, z) => Math.abs(x - ravineX(z)) > RH + margin && Math.abs(x - trackX(z)) > 9
        && !(z > -90 && z < 180 && x < ravineX(z) - RH + 4 && x > ravineX(z) - RH - 120) && Math.abs(x) < TW / 2 - 20;
      makeTrees(api, { n: coarse ? 380 : 620, ok: ok(6) });
      makeWalls(api, { n: coarse ? 420 : 700, ok: ok(4) });

      // Nebbia che dorme nella gravina e si dirada con il sole.
      const mists = [];
      for (let i = 0; i < 9; i++) {
        const z = 330 - i * 85, mat = new THREE.MeshBasicMaterial({ map: mistTexture(i + 3), color: 0xfbe7df, transparent: true, opacity: 0.5, depthWrite: false });
        const mg = new THREE.PlaneGeometry(RH * 1.5, 110); mg.rotateX(-Math.PI / 2);
        const m = new THREE.Mesh(mg, mat);
        m.position.set(ravineX(z), -RD + 9 + (i % 3) * 4, z);
        m.rotation.y = Math.atan((ravineX(z + 1) - ravineX(z - 1)) / 2);
        mists.push(m); group.add(m);
      }

      // Grillai (i falchetti di Gravina) che girano sopra il burrone.
      const birds = makeBirds(api, { n: 16, center: (i, r) => { const cz = 180 - (i % 5) * 70; return { cx: ravineX(cz) + (r() - 0.5) * 30, cz, rad: 16 + r() * 26, y: -10 + r() * 34 }; } });

      return {
        targets: windows,
        onGaze(i, clock) {
          litAt[i] = clock;
          winMesh.setColorAt(i, lit); winMesh.instanceColor.needsUpdate = true;
          if (windowHouse[i] >= 0) { houses.setColorAt(windowHouse[i], houseColors[windowHouse[i]].clone().lerp(warm, 0.55)); houses.instanceColor.needsUpdate = true; }
        },
        update(dt, clock, k) {
          mists.forEach((m, i) => { m.material.opacity = lerp(0.55, 0.12, k); m.material.map.offset.x += dt * 0.004 * (i % 2 ? 1 : -1); });
          birds(clock);
          let dirty = false;
          for (let i = 0; i < windows.length; i++) {
            if (litAt[i] < 0) continue;
            const age = clock - litAt[i], f = age < 1.2 ? age / 1.2 : 1;
            const v = f * (0.85 + 0.15 * Math.sin(clock * 3 + i)) * (1 - k * 0.35);
            if (Math.abs(glowCol[i * 3] - v) > 0.01) { glowCol.set([v, v * 0.7, v * 0.35], i * 3); dirty = true; }
          }
          if (dirty) glowGeo.attributes.color.needsUpdate = true;
        },
      };
    },
  });
}

/* ================================ Tappa 2: la Murgia, di mattina ================================= */
function buildMurgia() {
  const TW = 1500, TL = 1600;
  const trackX = (z) => 28 * Math.sin(z * 0.0042 + 0.6) + 10 * Math.sin(z * 0.011);
  const townZ = -90, townX = trackX(townZ) - 150;
  const hill = (x, z) => 16 * Math.exp(-(((x - townX) ** 2) + ((z - townZ) ** 2)) / (2 * 95 * 95));
  const raw = (x, z) => {
    const e = 1 - smooth(0.82, 1, Math.max(Math.abs(x) / (TW / 2), Math.abs(z) / (TL / 2)));
    return (6 * Math.sin(x * 0.0061 + 1) * Math.cos(z * 0.0052) + 3 * Math.sin(x * 0.017 + z * 0.013) + 0.9 * Math.sin(x * 0.05 - z * 0.04)) * e + hill(x, z);
  };
  const trackY = (z) => { let s = 0; for (let d = -40; d <= 40; d += 20) s += raw(trackX(z + d), z + d); return s / 5; };
  // Campi: grano (dove passa il vento), stoppie, arato, pascolo.
  const fieldCols = [C(0xdcbc6c), C(0xe3c67c), C(0xcdb582), C(0x9b7852), C(0x9fb064), C(0xc2ab72)];
  const cell = (x, z) => Math.floor(hash2(Math.floor((x + 0.3 * z) / 80), Math.floor((z - 0.25 * x) / 62)) * fieldCols.length);
  const inTown = (x, z) => Math.hypot(x - townX, z - townZ) < 95;
  const color = (x, y, z) => (inTown(x, z) ? tmpC.setHex(0xd8cba8) : tmpC.copy(fieldCols[cell(x, z)]).multiplyScalar(0.94 + hash2(Math.floor(x / 5), Math.floor(z / 5)) * 0.1));
  const wave = (x, y, z) => (!inTown(x, z) && cell(x, z) < 2 ? 1 : 0);

  return railLeg({
    index: 1, seed: 11, width: TW, length: TL, height: raw, color, wave, trackX, trackY, rolling: true, gazeBox: [0.5, 0.45], gazeDist: 300,
    livery: LIVERY.fal, palette: PAL.morning(), score: SCORE.murgia(), horizon: { ground: 0xc4ae74 },
    summary: (n) => (n ? `Hai fatto fiorire ${n} campi di papaveri. Dopo Altamura il treno scende verso Bari e il mare.` : 'Dopo Altamura il treno scende verso Bari e il mare.'),
    decorate(api) {
      const { group, R, height } = api;
      const ok = (m) => (x, z) => Math.abs(x - trackX(z)) > m && !inTown(x, z) && Math.abs(x) < TW / 2 - 20;
      const tufaMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

      // Altamura sulla collina: case di tufo e la cattedrale con i due campanili, facciata verso il treno.
      const town = [];
      for (let i = 0; i < 200; i++) {
        const a = R() * Math.PI * 2, r = Math.sqrt(R()) * 88, x = townX + Math.cos(a) * r, z = townZ + Math.sin(a) * r;
        if (Math.abs(x - trackX(z)) < 25 || Math.hypot(x - townX - 5, z - townZ) < 26) continue;
        town.push({ x, z, y: height(x, z) - 1, w: 5 + R() * 4, d: 5 + R() * 4, h: 5 + R() * 7, rot: (R() - 0.5) * 0.3, color: [0xe6d6b2, 0xdcc9a0, 0xefe2c4, 0xd6c296][Math.floor(R() * 4)] });
      }
      makeBlocks(group, town, tufaMat);
      {
        const cx = townX + 8, cz = townZ, cy = height(cx, cz) - 1;
        const stone = new THREE.MeshLambertMaterial({ color: 0xe8dcbf }), roofM = new THREE.MeshLambertMaterial({ color: 0x9a6a4c });
        const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; group.add(m); return m; };
        add(new THREE.BoxGeometry(40, 16, 15), stone, cx - 20, cy + 8, cz);
        const rs = new THREE.Shape([new THREE.Vector2(-8.3, 0), new THREE.Vector2(8.3, 0), new THREE.Vector2(0, 5)]);
        const roof = add(new THREE.ExtrudeGeometry(rs, { depth: 40, bevelEnabled: false }), roofM, cx - 40, cy + 16, cz);
        roof.rotation.y = Math.PI / 2;
        [-9.5, 9.5].forEach((dz) => {
          add(new THREE.BoxGeometry(6.5, 29, 6.5), stone, cx + 1, cy + 14.5, cz + dz);
          add(new THREE.ConeGeometry(4.6, 8, 4), roofM, cx + 1, cy + 33, cz + dz).rotation.y = Math.PI / 4;
        });
        add(new THREE.BoxGeometry(2, 3, 13), stone, cx + 1, cy + 24, cz);
        const rose = add(new THREE.CircleGeometry(2.4, 20), new THREE.MeshBasicMaterial({ color: 0x3d3026 }), cx + 0.06, cy + 11, cz);
        rose.rotation.y = Math.PI / 2;
        add(new THREE.BoxGeometry(0.3, 5, 3.4), new THREE.MeshLambertMaterial({ color: 0x4a3a2c }), cx + 0.1, cy + 2.5, cz);
      }

      // Masserie: casa, cortile murato, piccola torre.
      for (let i = 0, made = 0; made < 11 && i < 200; i++) {
        const z = 520 - R() * 1040, side = R() < 0.6 ? -1 : 1, x = trackX(z) + side * (90 + R() * 290);
        if (!ok(40)(x, z)) continue;
        made++;
        const y = height(x, z) - 0.8, rot = R() * Math.PI, walls = [];
        const put = (dx, dz, w, hh, d) => { const c = Math.cos(rot), s = Math.sin(rot); walls.push({ x: x + dx * c + dz * s, z: z - dx * s + dz * c, y, w, h: hh, d, rot, color: 0xefe6d2 }); };
        put(0, 0, 14, 7.5, 10); put(9, -3, 5, 11, 5);
        put(0, 13, 26, 2.6, 0.7); put(-13, 7, 0.7, 2.6, 13); put(13, 7, 0.7, 2.6, 13);
        makeBlocks(group, walls, tufaMat);
      }

      // Pale eoliche sui crinali lontani, che girano piano.
      const rotors = [];
      const white = new THREE.MeshLambertMaterial({ color: 0xf2f3f1 });
      for (let i = 0; i < 9; i++) {
        const z = 560 - i * 135 + (R() - 0.5) * 60, side = i % 2 ? 1 : -1, x = trackX(z) + side * (520 + R() * 200), y = height(x, z);
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.8, 62, 8), white); tower.position.set(x, y + 31, z);
        const nac = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 7), white); nac.position.set(x, y + 63, z);
        const rotor = new THREE.Group(); rotor.position.set(x + side * -3.8, y + 63, z);
        for (let b = 0; b < 3; b++) {
          const blade = new THREE.Mesh(new THREE.BoxGeometry(0.4, 26, 1.4), white); blade.position.y = 13;
          const arm = new THREE.Group(); arm.rotation.x = (b / 3) * Math.PI * 2; arm.add(blade); rotor.add(arm);
        }
        rotor.userData.sp = 0.5 + R() * 0.3;
        rotors.push(rotor); group.add(tower, nac, rotor);
      }

      makeTrees(api, { n: coarse ? 320 : 520, ok: ok(10) });
      makeTrees(api, { n: coarse ? 120 : 200, ok: ok(10), crown: 0xa6b07e, groves: 8 });
      makeWalls(api, { n: coarse ? 420 : 700, ok: ok(6) });

      // Papaveri: macchie rosse che crescono dove si posa lo sguardo, nei campi di grano.
      const patches = [];
      for (let i = 0; patches.length < 56 && i < 3000; i++) {
        const z = 520 - R() * 1060, side = R() < 0.8 ? -1 : 1, x = trackX(z) + side * (26 + R() * 110);
        if (!ok(20)(x, z) || cell(x, z) >= 2 || patches.some((p) => Math.hypot(p.x - x, p.z - z) < 32)) continue;
        patches.push({ x, z, y: height(x, z) });
      }
      const PER = 44, flowers = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.55, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), patches.length * PER);
      const d = new THREE.Object3D(), fc = new THREE.Color(), spots = [];
      patches.forEach((p, i) => {
        for (let k = 0; k < PER; k++) {
          const a = R() * Math.PI * 2, r = Math.sqrt(R()) * 11, x = p.x + Math.cos(a) * r, z = p.z + Math.sin(a) * r;
          spots.push({ x, y: height(x, z) + 0.45, z, s: 0.7 + R() * 0.6, delay: R() * 1.2 });
          d.position.set(x, -50, z); d.scale.setScalar(0.001); d.updateMatrix(); flowers.setMatrixAt(i * PER + k, d.matrix);
          flowers.setColorAt(i * PER + k, fc.setHex(0xd83227).offsetHSL((R() - 0.5) * 0.03, 0, (R() - 0.5) * 0.1));
        }
      });
      group.add(flowers);
      const bloomAt = new Array(patches.length).fill(-1);

      const birds = makeBirds(api, { n: 10, color: 0x2e2a2c, center: (i, r) => { const z = 400 - i * 90; return { cx: trackX(z) - 60 - r() * 120, cz: z, rad: 14 + r() * 20, y: height(trackX(z) - 80, z) + 10 + r() * 16 }; } });

      return {
        targets: patches.map((p) => V3(p.x, p.y + 1, p.z)),
        onGaze(i, clock) { bloomAt[i] = clock; },
        update(dt, clock) {
          rotors.forEach((r) => { r.rotation.x += dt * r.userData.sp; });
          birds(clock);
          let dirty = false;
          for (let i = 0; i < patches.length; i++) {
            if (bloomAt[i] < 0 || clock - bloomAt[i] > 3) continue;
            for (let k = 0; k < PER; k++) {
              const sp = spots[i * PER + k], f = smooth(0, 1, (clock - bloomAt[i] - sp.delay) / 1.4);
              d.position.set(sp.x, sp.y, sp.z); d.scale.set(sp.s * f, sp.s * f * 0.6, sp.s * f); d.updateMatrix();
              flowers.setMatrixAt(i * PER + k, d.matrix);
            }
            dirty = true;
          }
          if (dirty) flowers.instanceMatrix.needsUpdate = true;
        },
      };
    },
  });
}

/* ============================ Tappa 3: Bari, dal centro all'aeroporto ============================= */
function buildBari() {
  const TW = 1400, TL = 1600;
  const trackX = (z) => 12 * Math.sin(z * 0.0035);
  // Costa a sinistra del treno; Bari Vecchia sporge sul mare; verso l'aeroporto la costa si allontana.
  const coastX = (z) => trackX(z) - 72 - 22 * Math.sin(z * 0.006 + 1) - 65 * Math.exp(-(((z + 70) / 80) ** 2)) - 520 * smooth(-250, -480, z);
  const raw = (x, z) => {
    const cx = coastX(z), land = 1.6 + 0.5 * Math.sin(x * 0.03) * Math.cos(z * 0.02);
    return x >= cx ? land : Math.max(-9, 1.6 - (cx - x) * 0.4);
  };
  const airportZ = -640, runwayX = trackX(airportZ) - 215;
  const color = (x, y, z) => {
    const cx = coastX(z);
    if (x < cx + 3 && x > cx - 5) return tmpC.setHex(0xe6d5a8);
    if (x < cx) return tmpC.setHex(0x9c9a86);
    if (z < -330 && x < trackX(z) - 20) return tmpC.setHex(0x9fb06a).multiplyScalar(0.95 + hash2(Math.floor(x / 9), Math.floor(z / 9)) * 0.1);
    const park = hash2(Math.floor(x / 60), Math.floor(z / 60)) > 0.82;
    return tmpC.setHex(park ? 0x93a868 : (hash2(Math.floor(x / 7), Math.floor(z / 7)) > 0.5 ? 0xcfc7b6 : 0xd8d1c1));
  };

  return railLeg({
    index: 2, seed: 23, width: TW, length: TL, height: raw, color, trackX, trackY: () => 2.1, speed: 12,
    livery: LIVERY.fnb, palette: PAL.noon(), score: SCORE.bari(), horizon: { ground: 0xb9c08a, hills: false, minX: 150, minXBack: -1100, groundY: 1.6 },
    stopAtEnd: true, endMargin: 80, gazeBox: [0.5, 0.45], gazeDist: 320,
    summary: (n) => (n ? `Hai fatto alzare le bandiere a ${n} barche. Dall'aeroporto di Bari si vola verso Sofia.` : 'Dall\'aeroporto di Bari si vola verso Sofia.'),
    decorate(api) {
      const { group, R, height, track } = api;
      makeSea(group, { y: 0 });
      makeStation(api, { s: 30, lines: ['Bari Centrale'], big: true, building: 0xe4d5b7, roof: 0x8c6b52 });
      makeStation(api, { s: track.L - 80, lines: ['Aeroporto'], building: 0xdfe6ea, roof: 0x8b99a6 });

      // Lungomare: passeggiata chiara lungo la costa e palme.
      const pv = [], pi = [];
      let n = 0;
      for (let z = 420; z >= -250; z -= 4, n++) {
        const x = coastX(z);
        pv.push(x + 1, 2.05, z, x + 9, 2.05, z);
        if (z > -250) pi.push(n * 2, n * 2 + 1, n * 2 + 2, n * 2 + 1, n * 2 + 3, n * 2 + 2);
      }
      pi.splice(pi.length - 6, 6);
      const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(pv, 3)); pg.setIndex(pi); pg.computeVertexNormals();
      const prom = new THREE.Mesh(pg, new THREE.MeshLambertMaterial({ color: 0xece5d3, side: THREE.DoubleSide })); prom.receiveShadow = true; group.add(prom);
      const palms = [];
      for (let z = 400; z > -240; z -= 15) palms.push({ x: coastX(z) + 10.5, z });
      makeTrees(api, { points: palms, kind: 'palm', crown: 0x4f7a3a, trunk: 0x8a7458 });

      // Palazzi: la città moderna a destra, i palazzi del lungomare a sinistra, Bari Vecchia sul promontorio.
      const glint = { value: 0.15 };
      const blocks = [], cols = [0xefe7d6, 0xe8dcc2, 0xf1e3c4, 0xe3d3b4, 0xd9c8a8, 0xefd9b8, 0xd9a37b];
      for (let z = 480; z > -320; z -= 26) {
        for (let k = 0; k < 14; k++) {
          if (R() < 0.2) continue;
          const x = trackX(z) + 62 + k * 30 + (R() - 0.5) * 6, w = 18 + R() * 8, d = 16 + R() * 6;
          blocks.push({ x, z: z + (R() - 0.5) * 4, y: 1, w, d, h: (k < 2 ? 9 : 12) + R() * (k < 2 ? 8 : 20), color: cols[Math.floor(R() * cols.length)] });
        }
      }
      const old = [];
      for (let i = 0; i < 90; i++) {
        const z = -70 + (R() - 0.5) * 120, x = coastX(z) + 14 + R() * Math.max(10, trackX(z) - coastX(z) - 40);
        if (Math.hypot(x - (coastX(-95) + 45), z + 95) < 30 || Math.hypot(x - (coastX(-20) + 60), z + 20) < 34) continue;
        old.push({ x, z, y: height(x, z) - 0.5, w: 5 + R() * 4, d: 5 + R() * 4, h: 5 + R() * 6, color: [0xf0e8d6, 0xe8dcc2, 0xf3ecdc][Math.floor(R() * 3)] });
      }
      const low = [];
      for (let z = 460; z > -260; z -= 14) {
        if (Math.abs(z + 70) < 120 || R() < 0.45) continue;
        const room = trackX(z) - coastX(z) - 40;
        if (room < 12) continue;
        const x = coastX(z) + 20 + R() * room;
        low.push({ x, z: z + (R() - 0.5) * 6, y: 1.2, w: 9 + R() * 5, d: 8 + R() * 4, h: 5 + R() * 4, color: [0xf4efe4, 0xefe6d2, 0xf1e1c6][Math.floor(R() * 3)] });
      }
      makeBlocks(group, low, windowMaterial(glint, 0xfff1d0, 0x3b4654, 2.8, 3, 1.4));
      makeTrees(api, { n: coarse ? 90 : 150, ok: (x, z) => x > coastX(z) + 14 && x < trackX(z) - 14 && Math.abs(z + 70) > 120 && z > -300, kind: 'round', crown: 0x6f8f4a, groves: 20, spread: 60 });
      makeBlocks(group, blocks, windowMaterial(glint, 0xfff1d0, 0x3b4654));
      makeBlocks(group, old, new THREE.MeshLambertMaterial({ color: 0xffffff }));

      // Basilica di San Nicola: navata chiara, due torri di altezza diversa, abside; e il Castello Svevo.
      const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; group.add(m); return m; };
      {
        const bx = coastX(-95) + 45, bz = -95, by = height(bx, bz) - 0.5, stone = new THREE.MeshLambertMaterial({ color: 0xf1e8d2 });
        add(new THREE.BoxGeometry(18, 20, 46), stone, bx, by + 10, bz);
        const rs = new THREE.Shape([new THREE.Vector2(-9.6, 0), new THREE.Vector2(9.6, 0), new THREE.Vector2(0, 4.5)]);
        add(new THREE.ExtrudeGeometry(rs, { depth: 46, bevelEnabled: false }), new THREE.MeshLambertMaterial({ color: 0xc9b89a }), bx, by + 20, bz - 23);
        add(new THREE.BoxGeometry(8, 32, 8), stone, bx - 11, by + 16, bz + 20);
        add(new THREE.BoxGeometry(8, 24, 8), stone, bx + 11, by + 12, bz + 20);
        add(new THREE.CylinderGeometry(7, 7, 16, 16, 1, false, 0, Math.PI), stone, bx, by + 8, bz - 23).rotation.y = Math.PI / 2;
        const rose = add(new THREE.CircleGeometry(2.6, 20), new THREE.MeshBasicMaterial({ color: 0x3e342a }), bx, by + 13, bz + 23.06);
        rose.rotation.y = 0;
        const cx = coastX(-20) + 60, cz = -20, cy = height(cx, cz) - 0.5, cst = new THREE.MeshLambertMaterial({ color: 0xd9ccae });
        add(new THREE.BoxGeometry(44, 12, 44), cst, cx, cy + 6, cz);
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => add(new THREE.BoxGeometry(11, 17, 11), cst, cx + a * 22, cy + 8.5, cz + b * 22));
      }

      // Barche dei pescatori: galleggiano; guardate, alzano una bandiera colorata.
      const boats = [], boatWhite = new THREE.MeshLambertMaterial({ color: 0xf6f6f2 });
      const stripes = [0x1f63b5, 0xd8342c, 0x2f9e6b, 0xf2b632].map((c) => new THREE.MeshLambertMaterial({ color: c }));
      const flagCols = [0xd8342c, 0xf2b632, 0x1f63b5, 0x2f9e6b, 0xffffff].map((c) => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide }));
      const flagGeo = new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(0, 3.2), new THREE.Vector2(4.4, 1.6)]));
      for (let i = 0; boats.length < 28 && i < 400; i++) {
        const z = 380 - R() * 620, x = coastX(z) - 16 - R() * 80;
        if (boats.some((b) => Math.hypot(b.position.x - x, b.position.z - z) < 20)) continue;
        const b = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.1, 6.5), boatWhite); hull.position.y = 0.35;
        const band = new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.28, 6.55), stripes[i % 4]); band.position.y = 0.72;
        const cab = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.1, 1.8), boatWhite); cab.position.set(0, 1.3, 0.8);
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 6, 5), new THREE.MeshLambertMaterial({ color: 0x6e5a44 })); mast.position.set(0, 3.8, -1.2);
        const flag = new THREE.Mesh(flagGeo, flagCols[i % 5]); flag.position.set(0, 3.4, -1.2); flag.scale.setScalar(0.001);
        [hull, band, cab].forEach((m) => { m.castShadow = true; });
        b.add(hull, band, cab, mast, flag);
        b.position.set(x, 0, z); b.rotation.y = R() * Math.PI * 2; b.scale.setScalar(1.7);
        b.userData = { flag, ph: R() * 6, raised: -1 };
        boats.push(b); group.add(b);
      }

      // Aeroporto in fondo: pista, terminal, torre, un aereo che decolla verso la prossima tappa.
      const runwayLen = 900, rz = airportZ - 60, ry = height(runwayX, rz) + 0.12;
      add(new THREE.BoxGeometry(45, 0.2, runwayLen), new THREE.MeshLambertMaterial({ color: 0x40444a }), runwayX, ry, rz);
      const dashes = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.06, 12), new THREE.MeshBasicMaterial({ color: 0xf2f2ee }), 28);
      const dd = new THREE.Object3D();
      for (let i = 0; i < 28; i++) { dd.position.set(runwayX, ry + 0.12, rz + runwayLen / 2 - 20 - i * 31); dd.updateMatrix(); dashes.setMatrixAt(i, dd.matrix); }
      group.add(dashes);
      const tx = trackX(-560) - 105, tyy = height(tx, -560);
      add(new THREE.BoxGeometry(28, 12, 100), new THREE.MeshLambertMaterial({ color: 0x9fb8c8, emissive: 0x1a2a36 }), tx, tyy + 6, -560);
      add(new THREE.BoxGeometry(30, 1.2, 102), new THREE.MeshLambertMaterial({ color: 0xf2f2ee }), tx, tyy + 12.6, -560);
      add(new THREE.CylinderGeometry(2.2, 2.8, 34, 10), new THREE.MeshLambertMaterial({ color: 0xe9e6de }), tx - 30, tyy + 17, -470);
      add(new THREE.BoxGeometry(8, 5, 8), new THREE.MeshLambertMaterial({ color: 0x2a3a48 }), tx - 30, tyy + 36, -470);
      const parked = makePlane(); parked.position.set(tx - 38, tyy + 3.4, -600); parked.rotation.y = Math.PI / 2; group.add(parked);
      const jet = makePlane(); jet.position.set(runwayX, ry + 3.3, rz + runwayLen / 2 - 30); group.add(jet);
      let jetV = 0;

      const gulls = makeBirds(api, { n: 12, color: 0xf4f4f0, center: (i, r) => { const z = 380 - i * 55; return { cx: coastX(z) - 10 - r() * 60, cz: z, rad: 12 + r() * 25, y: 12 + r() * 20 }; } });

      return {
        targets: boats.map((b) => V3(b.position.x, 2, b.position.z)),
        onGaze(i, clock) { boats[i].userData.raised = clock; },
        update(dt, clock, k, prog) {
          gulls(clock);
          boats.forEach((b) => {
            const u = b.userData;
            b.position.y = Math.sin(clock * 1.3 + u.ph) * 0.22;
            b.rotation.z = Math.sin(clock * 1.1 + u.ph) * 0.07;
            if (u.raised >= 0) {
              const f = smooth(0, 1, (clock - u.raised) / 1.2);
              u.flag.scale.set(f, f, f); u.flag.rotation.y = Math.sin(clock * 3 + u.ph) * 0.35;
            }
          });
          // L'aereo parte quando il treno è quasi arrivato: rulla, si stacca, sale verso est.
          if (prog > 0.8) jetV = Math.min(jetV + dt * 9, 75);
          if (jetV > 0) {
            jet.position.z -= jetV * dt;
            const lift = Math.max(0, (rz + runwayLen / 2 - 30 - jet.position.z) - 380);
            jet.position.y = ry + 3.3 + lift * 0.22;
            jet.rotation.x = Math.min(0.2, lift * 0.004);
          }
        },
      };
    },
  });
}

/* ================================ Tappa 4: in volo sopra le nuvole ================================= */
function buildFlight() {
  const group = new THREE.Group(), R = rng(41);
  const LEN = 2700, Z0 = 250, ZEND = Z0 - LEN, SPEED = 46;
  const P = PAL.afternoon();
  makeSea(group, { y: -140, deep: 0x1c4f78, shallow: 0x2b7896, size: 9000 });
  // Terra dei Balcani sotto le nuvole, dopo la costa, con le cime che bucano lo strato.
  const landH = (x, z) => -150 + 22 * smooth(-900, -1150, z) + 8 * Math.sin(x * 0.01) * Math.cos(z * 0.008) * smooth(-900, -1150, z);
  const landCol = (x, y) => tmpC.setHex(y < -142 ? 0x2a6a88 : hash2(Math.floor(x / 60), Math.floor(y * 3)) > 0.5 ? 0x6f8a55 : 0x8c9a62);
  group.add(makeTerrain({ width: 3200, length: 2200, segX: 90, segZ: 70, height: landH, color: (x, y, z) => landCol(x, y, z), offsetZ: -2000 }));
  const peaks = [];
  for (let i = 0; i < 18; i++) {
    const z = -1000 - R() * 1500, side = R() < 0.5 ? -1 : 1, x = side * (70 + R() * 600), h = 150 + R() * 110, r = 90 + R() * 80;
    const g = new THREE.ConeGeometry(r, h, 9, 4), pos = g.attributes.position, col = new Float32Array(pos.count * 3);
    for (let k = 0; k < pos.count; k++) {
      const y = pos.getY(k) + h / 2;
      pos.setX(k, pos.getX(k) * (0.9 + 0.2 * hash2(k, i))); pos.setZ(k, pos.getZ(k) * (0.9 + 0.2 * hash2(i, k)));
      const c = y > h * 0.86 ? tmpC.setHex(0xe9ecef) : y > h * 0.55 ? tmpC.setHex(0x8b8a84) : tmpC.setHex(0x55704a);
      col.set([c.r, c.g, c.b], k * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
    m.position.set(x, -145 + h / 2, z); group.add(m); peaks.push(m);
  }
  // Il Vitosha, grande e scuro, che annuncia Sofia in fondo al volo.
  {
    const g = new THREE.ConeGeometry(800, 380, 14, 5), pos = g.attributes.position, col = new Float32Array(pos.count * 3);
    for (let k = 0; k < pos.count; k++) {
      const y = pos.getY(k) + 190; pos.setY(k, pos.getY(k) * (0.92 + 0.12 * hash2(k, 3)));
      const c = y > 300 ? tmpC.setHex(0x9a978f) : tmpC.setHex(0x4b6448); col.set([c.r, c.g, c.b], k * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
    m.position.set(-350, -150 + 190, ZEND - 700); group.add(m);
  }

  // Strato di nuvole: gruppi di sfere schiacciate, più rade verso la fine (si vede terra).
  const puffs = [], puffGeo = new THREE.IcosahedronGeometry(1, 1);
  for (let c = 0; c < 170; c++) {
    const cz = Z0 + 300 - R() * (LEN + 700), cx = (R() - 0.5) * 1700;
    if (cz < ZEND + 500 && R() < 0.65) continue;
    const n = 7 + Math.floor(R() * 8);
    for (let k = 0; k < n; k++) puffs.push({ x: cx + (R() - 0.5) * 70, y: R() * 12, z: cz + (R() - 0.5) * 50, r: 9 + R() * 16 });
  }
  const clouds = new THREE.InstancedMesh(puffGeo, new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), puffs.length);
  const d = new THREE.Object3D(), cc = new THREE.Color();
  puffs.forEach((p, i) => {
    d.position.set(p.x, p.y, p.z); d.scale.set(p.r, p.r * 0.55, p.r); d.updateMatrix(); clouds.setMatrixAt(i, d.matrix);
    clouds.setColorAt(i, cc.setHex(0xffffff).lerp(C(0xc9d3e2), clamp(1 - p.y / 12, 0, 1) * 0.5));
  });
  group.add(clouds);

  // Anelli di nuvole lungo la rotta: passarci dentro li colora e suona una campana.
  const RINGS = 12, RP = 16, rings = [];
  const ringMesh = new THREE.InstancedMesh(puffGeo, new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), RINGS * RP);
  for (let k = 0; k < RINGS; k++) {
    const c = V3(45 * Math.sin(k * 1.7), 58 + 16 * Math.sin(k * 1.1 + 0.5), Z0 - 240 - k * 195);
    rings.push({ c, passed: false, hitAt: -1 });
    for (let j = 0; j < RP; j++) {
      const a = (j / RP) * Math.PI * 2, r = 3.4 + R() * 1.2;
      d.position.set(c.x + Math.cos(a) * 13, c.y + Math.sin(a) * 13, c.z); d.scale.set(r, r, r * 0.8); d.updateMatrix();
      ringMesh.setMatrixAt(k * RP + j, d.matrix); ringMesh.setColorAt(k * RP + j, cc.setHex(0xffffff));
    }
  }
  group.add(ringMesh);
  const golden = C(0xffc98f);

  // L'aereo, la sua ombra sulle nuvole e le scie.
  const plane = makePlane(); group.add(plane);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(10, 24), new THREE.MeshBasicMaterial({ color: 0x1b2533, transparent: true, opacity: 0.16, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; group.add(shadow);
  const TRAIL = 9, trails = [0, 1].map(() => {
    const pos = new Float32Array(TRAIL * 2 * 3), col = new Float32Array(TRAIL * 2 * 3), idx = [];
    for (let i = 0; i < TRAIL - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    for (let i = 0; i < TRAIL; i++) { const f = Math.sin(Math.PI * Math.min(1, (i + 1) / TRAIL)) * Math.pow(1 - i / TRAIL, 0.8) * 0.5; col.set([f, f * 0.72, f * 0.86, f, f * 0.72, f * 0.86], i * 6); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false }));
    m.frustumCulled = false; group.add(m);
    return { g, pts: [] };
  });

  let px = 0, py = 60, pz = Z0, clock = 0, count = 0, finished = false;
  const camPos = V3(0, 72, Z0 + 40), camAim = V3(0, 60, Z0 - 60), wing = V3();
  setCounter(LEGS[3].counter, 0, RINGS);

  function update(dt, active) {
    clock += dt;
    pz -= SPEED * dt;
    const tx = clamp(-look.yaw * 150, -170, 170), ty = clamp(62 - look.pitch * 110, 32, 105);
    const ax = 1 - Math.exp(-dt * 0.9), ay = 1 - Math.exp(-dt * 0.8);
    const vx = (tx - px) * ax, vy = (ty - py) * ay;
    px += vx; py += vy;
    plane.position.set(px, py + Math.sin(clock * 0.8) * 0.4, pz);
    plane.rotation.set(clamp(vy * 0.8, -0.25, 0.25), 0, clamp(-(tx - px) * 0.012, -0.55, 0.55));

    const prog = clamp((Z0 - pz) / LEN, 0, 1);
    $('legprogress').style.width = `${(prog * 100).toFixed(1)}%`;
    const k = smooth(0, 1, prog);
    applyPalette(P, k, plane.position, null);

    // Ombra: proiettata sulla cima delle nuvole nella direzione opposta al sole.
    const drop = py - 14, sh = Math.max(0.2, sunDirV.y);
    shadow.position.set(px - (sunDirV.x / sh) * drop, 14.5, pz - (sunDirV.z / sh) * drop);
    shadow.scale.setScalar(1 + drop * 0.004);

    for (const r of rings) {
      if (r.passed || pz > r.c.z) continue;
      r.passed = true;
      if (Math.hypot(px - r.c.x, py - r.c.y) < 14) {
        r.hitAt = clock; count++; Sound.chime(); setCounter(LEGS[3].counter, count, RINGS);
        const k2 = rings.indexOf(r);
        for (let j = 0; j < RP; j++) ringMesh.setColorAt(k2 * RP + j, golden);
        ringMesh.instanceColor.needsUpdate = true;
      }
    }

  };
}

/* ========================= Tappa 5: Sofia all'ora dorata, metro M4 sul viadotto ========================= */
function buildSofia() {

  const trackX = (z) => 25 * Math.sin(z * 0.0038);

  };
  const color = (x, y, z) => {
    const park = hash2(Math.floor(x / 70), Math.floor(z / 70)) > 0.7;
    if (park) return tmpC.setHex(hash2(Math.floor(x / 9), Math.floor(z / 9)) > 0.5 ? 0x8e9a58 : 0x9f9b56);
    return tmpC.setHex(hash2(Math.floor(x / 8), Math.floor(z / 8)) > 0.45 ? 0xbdb8a8 : 0xa9a597);
  };
  return railLeg({
    index: 4, seed: 51, width: TW, length: TL, height: raw, color, trackX, trackY: (z) => 11 + raw(trackX(z), z) * 0.3,
    viaduct: true, metro: true, livery: LIVERY.metro, cars: 3, carLength: 14, speed: 15,

    camera: { minAbove: 4 }, gazeBox: [0.42, 0.8], gazeDist: 380,
    summary: (n) => (n ? `Hai fatto brillare ${n} cupole di Sofia. Da Iskarsko shose parte il treno per Karlovo.` : 'Da Iskarsko shose parte il treno per Karlovo.'),
    decorate(api) {
      const { group, R, height, track } = api;
      makeStation(api, { s: 30, lines: ['Летище София', 'Sofia Airport'], elevated: true, sign: '#1b5fa8' });
      makeStation(api, { s: track.L - 80, lines: ['Искърско шосе', 'Iskarsko shose'], elevated: true, sign: '#1b5fa8' });

      // Il Vitosha: una montagna enorme e scura a sud-ovest, sempre sullo sfondo.
      {
        const RAD = 1500, H = 520, rings = 36, segs = 72, pos = [], col = [], idx = [];
        for (let i = 0; i <= rings; i++) {
          for (let j = 0; j <= segs; j++) {
            const r = (i / rings) * RAD, a = (j / segs) * Math.PI * 2;
            const n = 0.85 + 0.15 * Math.sin(a * 5 + 1) * Math.sin(a * 3) + 0.05 * Math.sin(a * 17);
            const y = H * Math.pow(Math.max(0, 1 - r / RAD), 1.35) * n + 6 * Math.sin(r * 0.05 + a * 9);
            pos.push(Math.cos(a) * r, y, Math.sin(a) * r);
            const c = y > 400 ? tmpC.setHex(0xa19d8c) : y > 250 ? tmpC.setHex(0x6d7358) : tmpC.setHex(0x3f5a45);
            col.push(c.r, c.g, c.b);
          }
        }
        for (let i = 0; i < rings; i++) for (let j = 0; j < segs; j++) { const a = i * (segs + 1) + j, b = a + segs + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
        const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
        m.position.set(-1900, -2, -1500); group.add(m);
      }

      // Grandi condomini a pannelli, color pastello; al tramonto alcune finestre riflettono il sole.
      const glint = { value: 0.6 };
      const cols = [0xe7d9a9, 0xe6ae90, 0xaec6d8, 0xcbc7bd, 0xd9d3c5, 0xb9cfa8, 0xe8c8b8];
      const blocks = [];
      for (let i = 0; blocks.length < 120 && i < 3000; i++) {
        const z = 540 - R() * 1100, side = R() < 0.5 ? -1 : 1, x = trackX(z) + side * (side < 0 ? 170 + R() * 420 : 40 + R() * 440);
        const w = 38 + R() * 30, dd = 11 + R() * 3, h = 24 + R() * 18, rot = R() < 0.5 ? 0 : Math.PI / 2;
        const rx = rot ? dd : w, rz = rot ? w : dd;
        if (Math.abs(x - trackX(z)) < rx / 2 + 12) continue;
        if (blocks.some((b) => Math.abs(b.x - x) < (b.rx + rx) / 2 + 8 && Math.abs(b.z - z) < (b.rz + rz) / 2 + 8)) continue;
        blocks.push({ x, z, y: height(x, z) - 1, w, d: dd, h, rot, rx, rz, color: cols[Math.floor(R() * cols.length)] });
      }
      makeBlocks(group, blocks, windowMaterial(glint, 0xffc27a, 0x2f3a46));
      const free = (x, z, r) => !blocks.some((b) => Math.abs(b.x - x) < b.rx / 2 + r && Math.abs(b.z - z) < b.rz / 2 + r) && Math.abs(x - trackX(z)) > r + 10;

      // Chiese con cupole d'oro; la cattedrale Aleksandr Nevskij più avanti, a sinistra.
      const domes = [], gold = () => new THREE.MeshLambertMaterial({ color: 0xd6a23e, emissive: 0x000000 });
      const white = new THREE.MeshLambertMaterial({ color: 0xefe7d8 }), green = new THREE.MeshLambertMaterial({ color: 0x7d978a });
      const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; group.add(m); return m; };
      const dome = (x, y, z, r, mat) => add(new THREE.SphereGeometry(r, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat, x, y, z);
      for (let i = 0, made = 0; made < 9 && i < 500; i++) {
        const z = 480 - R() * 780, side = R() < 0.8 ? -1 : 1, x = trackX(z) + side * (45 + R() * 90);
        if (!free(x, z, 14) || domes.some((dm) => Math.hypot(dm.pos.x - x, dm.pos.z - z) < 60)) continue;
        made++;
        const y = height(x, z) - 0.5, mat = gold();
        add(new THREE.BoxGeometry(10, 9, 18), white, x, y + 4.5, z);
        add(new THREE.CylinderGeometry(3.2, 3.2, 3.5, 12), white, x, y + 10.7, z);
        dome(x, y + 12.4, z, 3.4, mat);
        add(new THREE.BoxGeometry(0.25, 2.2, 0.25), mat, x, y + 16.8, z);
        add(new THREE.BoxGeometry(1.2, 0.25, 0.25), mat, x, y + 17.2, z);
        domes.push({ mat, pos: V3(x, y + 14, z), r: 3.4 });
      }
      {
        const z = -380, x = trackX(z) - 120, y = height(x, z) - 0.5, mat = gold();
        add(new THREE.BoxGeometry(26, 24, 46), white, x, y + 12, z);
        add(new THREE.BoxGeometry(46, 24, 26), white, x, y + 12, z);
        add(new THREE.CylinderGeometry(9, 9, 10, 20), white, x, y + 29, z);
        dome(x, y + 33.5, z, 10.5, mat);
        [[-14, -14], [14, -14], [-14, 14], [14, 14]].forEach(([a, b]) => { add(new THREE.CylinderGeometry(4, 4, 5, 12), white, x + a, y + 26.5, z + b); dome(x + a, y + 29, z + b, 4.5, green); });
        add(new THREE.BoxGeometry(10, 46, 10), white, x, y + 23, z + 30);
        const tmat = gold(); dome(x, y + 46, z + 30, 4.8, tmat);
        domes.push({ mat: tmat, pos: V3(x, y + 48, z + 30), r: 4.8 }, { mat, pos: V3(x, y + 38, z), r: 10.5 });
      }

      makeTrees(api, { n: coarse ? 260 : 420, ok: (x, z) => free(x, z, 4) && Math.abs(x) < TW / 2 - 20, kind: 'round', crown: 0xa7a246, spread: 90, groves: 18 });
      makeTrees(api, { n: coarse ? 120 : 200, ok: (x, z) => free(x, z, 4) && Math.abs(x) < TW / 2 - 20, kind: 'round', crown: 0xc29a3c, spread: 90, groves: 12 });

      // Scintillio delle cupole guardate: un bagliore dorato che pulsa.
      const spark = new THREE.BufferGeometry(), sp = new Float32Array(domes.length * 3), sc = new Float32Array(domes.length * 3);
      domes.forEach((dm, i) => sp.set([dm.pos.x, dm.pos.y, dm.pos.z], i * 3));
      spark.setAttribute('position', new THREE.BufferAttribute(sp, 3)); spark.setAttribute('color', new THREE.BufferAttribute(sc, 3));
      group.add(new THREE.Points(spark, new THREE.PointsMaterial({ size: 26, map: glowTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
      const shineAt = new Array(domes.length).fill(-1);

      return {
        targets: domes.map((dm) => dm.pos),
        onGaze(i, clock) { shineAt[i] = clock; },
        update(dt, clock, k) {
          glint.value = lerp(0.55, 1, k);
          domes.forEach((dm, i) => {
            if (shineAt[i] < 0) return;
            const age = clock - shineAt[i], pulse = Math.exp(-age * 0.6) * 0.9 + 0.25 + 0.1 * Math.sin(clock * 2.5 + i);
            dm.mat.emissive.setRGB(0.5 * pulse, 0.32 * pulse, 0.08 * pulse);
            sc.set([pulse, pulse * 0.72, pulse * 0.3], i * 3);
          });
          spark.attributes.color.needsUpdate = true;
        },
      };
    },
  });
}

/* =================== Tappa 6: Valle delle Rose, dal tramonto alla sera, fino a Karlovo =================== */
function buildKarlovo() {
  const TW = 1500, TL = 1600;
  const trackX = (z) => 20 * Math.sin(z * 0.0033 + 0.4);
  const raw = (x, z) => {
    const e = 1 - smooth(0.82, 1, Math.max(Math.abs(x) / (TW / 2), Math.abs(z) / (TL / 2)));
    return (3 * Math.sin(x * 0.005) * Math.cos(z * 0.006) + 1.2 * Math.sin(x * 0.02 + z * 0.015)) * e + Math.max(0, -x - 300) * 0.12 * e + Math.max(0, x - 420) * 0.05 * e;
  };
  const trackY = (z) => { let s = 0; for (let d = -40; d <= 40; d += 20) s += raw(trackX(z + d), z + d); return s / 5; };
  // Campi di rose (e qualcuno di lavanda) a file, vicino al binario, di più a sinistra verso i monti.
  const FR = rng(606), fields = [];
  for (let i = 0; fields.length < 33 && i < 600; i++) {
    const z = 470 - FR() * 900, side = FR() < 0.7 ? -1 : 1, x = trackX(z) + side * (30 + FR() * 150);
    const w = 34 + FR() * 16, d = 24 + FR() * 12, rot = FR() < 0.5 ? 0 : Math.PI / 2;
    if (fields.some((f) => Math.hypot(f.x - x, f.z - z) < 55) || Math.abs(x - trackX(z)) < Math.max(w, d) / 2 + 12) continue;
    fields.push({ x, z, w, d, rot, lav: fields.length >= 26 });
  }
  const inField = (x, z) => fields.find((f) => {
    const c = Math.cos(f.rot), s = Math.sin(f.rot), lx = (x - f.x) * c - (z - f.z) * s, lz = (x - f.x) * s + (z - f.z) * c;
    return Math.abs(lx) < f.w / 2 && Math.abs(lz) < f.d / 2;
  });
  const townZ = -520;
  const color = (x, y, z) => {
    const f = inField(x, z);
    if (f) return tmpC.setHex(f.lav ? 0x7c6c58 : 0x7a6a50);
    if (y > 30) return tmpC.setHex(0x5f7a4c);
    return tmpC.setHex([0x7f9a4f, 0x97a55a, 0xa6a35e, 0xc8b27a][Math.floor(hash2(Math.floor((x + 0.3 * z) / 70), Math.floor((z - 0.2 * x) / 55)) * 4)])
      .multiplyScalar(0.94 + hash2(Math.floor(x / 5), Math.floor(z / 5)) * 0.1);
  };

  return railLeg({
    index: 5, seed: 61, width: TW, length: TL, height: raw, color, trackX, trackY, rolling: true, speed: 13,
    livery: LIVERY.bdz, palette: PAL.dusk(), score: SCORE.karlovo(), horizon: { ground: 0x7f8f55 }, stopAtEnd: true, endMargin: 80,
    gazeBox: [0.5, 0.45], gazeDist: 300,
    summary: (n) => `Da Gravina a Karlovo: 8 h 19 min porta a porta, circa 35–100 € a persona.${n ? ` Lungo la valle hai risvegliato ${n} campi di rose.` : ''}`,
    decorate(api) {
      const { group, R, height, track } = api;
      makeStation(api, { s: track.L - 80, lines: ['Карлово', 'Karlovo'], building: 0xe9dfc9, roof: 0xa8412d, sign: '#2f5f8f' });

      // Monti Balcani (Stara Planina) a sinistra, Sredna Gora più bassa a destra.
      const ridge = (x0, height0, width0, cols, flip) => {
        const g = new THREE.PlaneGeometry(1400, 4200, 70, 160); g.rotateX(-Math.PI / 2);
        const p = g.attributes.position, col = new Float32Array(p.count * 3);
        for (let i = 0; i < p.count; i++) {
          const lx = p.getX(i), z = p.getZ(i), across = flip ? -lx : lx;
          const prof = Math.exp(-((across + 150) ** 2) / (2 * width0 * width0));
          const y = height0 * prof * (0.75 + 0.18 * Math.sin(z * 0.004 + 1) + 0.1 * Math.sin(z * 0.013) + 0.05 * Math.sin(z * 0.04 + lx * 0.02)) - 4;
          p.setY(i, y);
          const c = y > height0 * 0.72 ? tmpC.setHex(cols[2]) : y > height0 * 0.4 ? tmpC.setHex(cols[1]) : tmpC.setHex(cols[0]);
          col.set([c.r, c.g, c.b], i * 3);
        }
        g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
        const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
        m.position.x = x0; group.add(m);
      };
      ridge(-1300, 520, 330, [0x3f5a44, 0x56694f, 0x8c8c7a], false);
      ridge(1350, 230, 300, [0x55704a, 0x6a7a55, 0x807f6c], true);

      // Cespugli di rose e di lavanda a file.
      const bushes = [];
      fields.forEach((f, fi) => {
        const c = Math.cos(f.rot), s = Math.sin(f.rot);
        for (let a = -f.w / 2 + 1.6; a < f.w / 2; a += 3.2) {
          for (let b = -f.d / 2 + 1.2; b < f.d / 2; b += 2.3) {
            const x = f.x + a * c + b * s, z = f.z - a * s + b * c;
            bushes.push({ x, z, fi, lav: f.lav });
          }
        }
      });
      const bushMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), bushes.length);
      const d = new THREE.Object3D(), bc = new THREE.Color();
      bushes.forEach((b, i) => {

        bushMesh.setMatrixAt(i, d.matrix);
        const base = b.lav ? [0x8a74c4, 0x7b68b5][Math.floor(R() * 2)] : (R() < 0.3 ? 0x5f7f47 : [0xe27aa3, 0xd65b8e, 0xf1a7c3][Math.floor(R() * 3)]);
        bushMesh.setColorAt(i, bc.setHex(base));

      bushMesh.castShadow = true;
      group.add(bushMesh);

      // Pioppi lungo il binario, noci sparsi; villaggi con i tetti rossi; Karlovo e la torre dell'orologio.
      const poplars = [];
      for (let z = 520; z > -540; z -= 34) [-1, 1].forEach((sd) => { if (R() < 0.7) poplars.push({ x: trackX(z) + sd * (15 + R() * 4), z: z + (R() - 0.5) * 8 }); });
      makeTrees(api, { points: poplars, kind: 'poplar', crown: 0x5f8048 });

      const houses = [], villages = [[trackX(260) + 150, 260], [trackX(-60) - 170, -60], [trackX(-300) + 130, -300]];

        houses.push({ x, z, y: height(x, z) - 0.5, w: 7 + R() * 4, d: 6 + R() * 4, h: 5 + R() * 4, rot: (R() - 0.5) * 0.3, color: [0xefe9dc, 0xe8dfcc, 0xf2eadb, 0xe6d3b8][Math.floor(R() * 4)] });

      const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; group.add(m); return m; };
      {

        add(new THREE.BoxGeometry(5.5, 26, 5.5), stone, x, y + 13, z);

        add(new THREE.CircleGeometry(1.6, 20), new THREE.MeshBasicMaterial({ color: 0xf6f0e0 }), x - 2.8, y + 21, z).rotation.y = -Math.PI / 2;

      const petals = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.9, vertexColors: true, transparent: true, depthWrite: false }));
      petals.frustumCulled = false; group.add(petals);
      let pNext = 0;
      const roseFields = fields.map((f, i) => ({ ...f, i })).filter((f) => !f.lav);

        onGaze(i) {

            const a = R() * Math.PI * 2, r = R() * Math.min(f.w, f.d) * 0.45, x = f.x + Math.cos(a) * r, z = f.z + Math.sin(a) * r;
            pPos.set([x, height(x, z) + 1, z], j * 3);
            pVel.set([(R() - 0.5) * 2.5, 2 + R() * 2.8, (R() - 0.5) * 2.5 + 1.2], j * 3);
            pLife[j] = 4 + R() * 2.5;
            const c = bc.setHex([0xf3a6c4, 0xe27aa3, 0xffd1e0][Math.floor(R() * 3)]);
            pCol.set([c.r, c.g, c.b, 1], j * 4);
          }
        },
        update(dt, clock, k, prog, s) {
          dusk.value = smooth(0.35, 0.85, k);
          Sound.setCrickets(smooth(0.25, 0.9, k));
          const fk = smooth(0.4, 0.9, k);
          for (let i = 0; i < FF; i++) {
            if (ffPos[i * 3 + 2] > track.pointAt(s).z + 30) respawn(i, s);
            const b = Math.pow(Math.max(0, Math.sin(clock * 1.7 + ffPh[i])), 6) * fk;
            ffCol.set([b, b * 0.95, b * 0.45], i * 3);
            ffPos[i * 3 + 1] += Math.sin(clock + ffPh[i]) * dt * 0.3;
          }
          ffGeo.attributes.position.needsUpdate = true; ffGeo.attributes.color.needsUpdate = true;
          let alive = false;
          for (let j = 0; j < PET; j++) {
            if (pLife[j] <= 0) continue;
            alive = true;
            pLife[j] -= dt;
            pVel[j * 3 + 1] -= dt * 0.45;
            pPos[j * 3] += (pVel[j * 3] + Math.sin(clock * 2 + j) * 0.8) * dt;
            pPos[j * 3 + 1] += pVel[j * 3 + 1] * dt;
            pPos[j * 3 + 2] += (pVel[j * 3 + 2] + Math.cos(clock * 1.7 + j) * 0.8) * dt;
            pCol[j * 4 + 3] = clamp(pLife[j] / 1.5, 0, 1);
          }
          if (alive) { pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; }
          doorGlow.material.opacity = smooth(0.8, 1, prog) * 0.9;
          doorMat.color.setHex(prog > 0.9 ? 0xffc47a : 0x6b4a32);
        },
      };
    },
  });
}

/* ---------------------------------------------- Flusso ------------------------------------------------ */
let legIndex = 0, leg = null, started = false;

function disposeTree(obj) {
  obj.traverse((o) => {
    o.geometry?.dispose();
    const m = o.material; if (!m) return;
    (Array.isArray(m) ? m : [m]).forEach((x) => { x.map?.dispose(); x.dispose(); });
  });
}

function startLeg(i) {
  if (leg) { scene.remove(leg.group); disposeTree(leg.group); }
  legIndex = i;
  look.ty = look.tp = look.yaw = look.pitch = 0;
  flightMode = LEGS[i].mode === 'air';
  $('legprogress').style.width = '0%';
  leg = LEGS[i].build();
  scene.add(leg.group);
  renderLegLine(i, false);
  $('legname').textContent = LEGS[i].name;
  $('legcount').textContent = `Tappa ${i + 1} di ${LEGS.length}`;
  $('endcard').hidden = true;
  if (started) {
    Sound.playLeg(leg.score);
    showTitle(LEGS[i]);
    if (flightMode) showHint(coarse ? 'Trascina con un dito per guidare l\'aereo' : 'Trascina, scorri o usa le frecce per guidare l\'aereo');
  }
}

function transitionTo(i) {
  $('endcard').hidden = true;
  const fade = $('fade');
  fade.classList.add('on');
  setTimeout(() => { startLeg(i); requestAnimationFrame(() => requestAnimationFrame(() => fade.classList.remove('on'))); }, 750);
}

function finishLeg() {
  renderLegLine(legIndex, true);
  const next = LEGS[legIndex + 1], summary = leg.summary?.() ?? '';
  if (next) {
    endCard({ kicker: 'Fine della tappa', title: `Prossima fermata: ${next.name}`, text: summary,
      actions: [[`Tappa successiva: ${next.name}`, () => transitionTo(legIndex + 1)]] });
  } else {
    Sound.finale();
    endCard({ kicker: 'Arrivo', title: 'Sei arrivato a Karlovo', text: summary,
      actions: [['Rifai il viaggio', () => transitionTo(0)], ...(inSite ? [['Cerca il tuo viaggio', () => { location.href = '/'; }, true]] : [])] });
  }
}

/* --------------------------------------------- Ciclo ------------------------------------------------- */
let last = performance.now(), slowFrames = 0, frames = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  applyKeys(dt);
  const d = 1 - Math.exp(-dt * 5);
  look.yaw = lerp(look.yaw, look.ty, d); look.pitch = lerp(look.pitch, look.tp, d);
  uTime.value += dt;
  leg.update(dt, started);
  if (started) Sound.ambient(dt);
  sky.mesh.position.copy(camera.position);
  renderer.render(scene, camera);

  // 60 fps prima di tutto: se il computer fatica, meno pixel e poi niente ombre.
  frames++;
  if (dt > 0.024) slowFrames++;
  if (frames >= 120) {
    if (slowFrames > 50) {
      if (pixelRatio > 1) { pixelRatio = 1; renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false); }
      else if (shadowsOn) { shadowsOn = false; renderer.shadowMap.enabled = false; sun.castShadow = false; scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); }
    }
    frames = slowFrames = 0;
  }
  requestAnimationFrame(frame);
}

function boot(data = {}) {
  // #tappa3 nell'indirizzo apre direttamente la terza tappa.
  const m = /^#tappa([1-6])$/.exec(location.hash);
  startLeg(clamp(m ? Number(m[1]) - 1 : data.leg ?? 0, 0, LEGS.length - 1));
  requestAnimationFrame(frame);
  window.claude?.hot?.snapshot?.(() => ({ leg: legIndex }));
}
$('start').addEventListener('click', () => {
  started = true;
  $('startcard').hidden = true;
  Sound.start();
  Sound.playLeg(leg.score);
  showTitle(LEGS[legIndex]);
  showHint(flightMode ? 'Trascina per guidare l\'aereo' : coarse ? 'Trascina con un dito per guardarti intorno' : 'Trascina, scorri con il trackpad o usa le frecce per guardarti intorno');
  canvas.focus({ preventScroll: true });
});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
